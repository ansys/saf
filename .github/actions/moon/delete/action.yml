name: Delete cache

description: |
  Delete the cache for PRs.

inputs:
  token:
    description: "The GitHub token to use for deleting the cache."
    required: true

runs:
  using: "composite"
  steps:
    - name: Delete caches
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REF: refs/pull/${{ github.event.pull_request.number }}/merge
      run: |
        ids=$(gh api --method GET \
          "repos/${GITHUB_REPOSITORY}/actions/caches" \
          --field ref="$REF" \
          --field per_page=100 \
          --paginate \
          --jq '.actions_caches[].id')

        if [ -z "$ids" ]; then
          echo "No caches found for deletion."
          exit 0
        fi

        for id in $ids; do
          echo "Deleting cache with ID: $id"
          gh cache delete $id --repo ${GITHUB_REPOSITORY}
          echo "Deleted cache with ID: $id"
        done
