name: Restore cache

description: |
  Restore the Moon project cache.

inputs:
  ref:
    description: "The git reference to checkout."
    required: true
  key-suffix:
    description: "The suffix to append to the cache key."
    required: true

outputs:
  uv-cache-hit:
    description: "Indicates whether the uv cache was hit."
    value: ${{ steps.restore-uv-cache.outputs.cache-hit }}

runs:
  using: "composite"
  steps:
    - name: Configure uv cache
      shell: bash
      run: | # zizmor: ignore[github-env]
        echo "UV_CACHE_DIR=$GITHUB_WORKSPACE/.uv-cache" >> $GITHUB_ENV
        echo "UV_LINK_MODE=copy" >> $GITHUB_ENV

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        ref: ${{ inputs.ref }}
        fetch-depth: 0

    - name: Setup Moon Toolchain
      uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4

    - name: Restore uv cache
      id: restore-uv-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.UV_CACHE_DIR }}
        key: uv-${{ runner.os }}-${{ inputs.key-suffix}}-${{ hashFiles('uv.lock')
          }}
        restore-keys: |
          uv-${{ runner.os }}-${{ inputs.key-suffix }}-

    - name: Moon cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .moon/cache
        key: moon-${{ runner.os }}-${{ inputs.key-suffix }}-branch-${{ github.head_ref
          || github.ref_name }}@${{ github.sha }}
        restore-keys: |
          moon-${{ runner.os }}-${{ inputs.key-suffix }}-branch-${{ github.head_ref || github.ref_name }}@
          moon-${{ runner.os }}-${{ inputs.key-suffix }}-branch-${{ github.base_ref || github.ref_name }}@
