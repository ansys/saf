name: Save cache

description: |
  Save the Moon project cache.

inputs:
  key-suffix:
    description: "The suffix to append to the cache key."
    required: true
  uv-cache-hit:
    description: "Indicates whether the uv cache was hit."
    required: false

runs:
  using: "composite"
  steps:
    - name: Prune uv cache
      shell: bash
      env:
        UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
      run: moon run root:uv-cache-prune

    - name: Clean Moon cache
      shell: bash
      run: moon clean --lifetime="7 days"

    - name: Save uv cache
      if: ${{ inputs.uv-cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.UV_CACHE_DIR }}
        key: uv-${{ runner.os }}-${{ inputs.key-suffix }}-${{ hashFiles('uv.lock')
          }}

    - name: Save Moon cache
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .moon/cache
        key: moon-${{ runner.os }}-${{ inputs.key-suffix }}-branch-${{ github.head_ref
          || github.ref_name }}@${{ github.sha }}
