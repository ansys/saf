version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(dependabot):"
    groups:
      all-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      include:
        - '*'
      default-days: 7
  - package-ecosystem: "npm"
    directory: "/packages/saf-projects-dashboard"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "ci(dependabot):"
    versioning-strategy: "lockfile-only"
    open-pull-requests-limit: 1
    groups:
      npm-security:
        applies-to: "security-updates"
        patterns:
          - "*"
    cooldown:
      include:
        - '*'
      default-days: 7
