# Workflow documented in architecture\ci-meta-package-execution.md
name: CI-CD for SAF SDK Meta Package
run-name: >-
  Meta-Package: ${{ inputs.release && 'Release' || 'Dry Run' }} by ${{ github.actor
  }} Update type: ${{ inputs.meta-package-version-update-type }} ${{ fromJSON(inputs.version-overrides
  || '{}')['ansys-bdm-api'] && format('ansys-bdm-api: {0}', fromJSON(inputs.version-overrides
  || '{}')['ansys-bdm-api']) || '' }} ${{ fromJSON(inputs.version-overrides || '{}')['ansys-bdm-shared-volume']
  && format('ansys-bdm-shared-volume: {0}', fromJSON(inputs.version-overrides || '{}')['ansys-bdm-shared-volume'])
  || '' }} ${{ fromJSON(inputs.version-overrides || '{}')['ansys-saf-glow-engine']
  && format('ansys-saf-glow-engine: {0}', fromJSON(inputs.version-overrides || '{}')['ansys-saf-glow-engine'])
  || '' }} ${{ fromJSON(inputs.version-overrides || '{}')['ansys-saf-desktop-installer']
  && format('ansys-saf-desktop-installer: {0}', fromJSON(inputs.version-overrides
  || '{}')['ansys-saf-desktop-installer']) || '' }} ${{ fromJSON(inputs.version-overrides
  || '{}')['ansys-saf-desktop-orchestrator'] && format('ansys-saf-desktop-orchestrator:
  {0}', fromJSON(inputs.version-overrides || '{}')['ansys-saf-desktop-orchestrator'])
  || '' }} ${{ fromJSON(inputs.version-overrides || '{}')['ansys-iam-oidc'] && format('ansys-iam-oidc:
  {0}', fromJSON(inputs.version-overrides || '{}')['ansys-iam-oidc']) || '' }} ${{
  fromJSON(inputs.version-overrides || '{}')['ansys-saf-product-configuration'] &&
  format('ansys-saf-product-configuration: {0}', fromJSON(inputs.version-overrides
  || '{}')['ansys-saf-product-configuration']) || '' }} ${{ fromJSON(inputs.version-overrides
  || '{}')['ansys-saf-product-manager'] && format('ansys-saf-product-manager: {0}',
  fromJSON(inputs.version-overrides || '{}')['ansys-saf-product-manager']) || '' }}
  ${{ fromJSON(inputs.version-overrides || '{}')['ansys-saf-projects-dashboard'] &&
  format('ansys-saf-projects-dashboard: {0}', fromJSON(inputs.version-overrides ||
  '{}')['ansys-saf-projects-dashboard']) || '' }}
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release ansys-saf-sdk package"
        required: false
        type: boolean
        default: false
      meta-package-version-update-type:
        description: "Requested SDK meta-package version update type"
        required: false
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
        default: "auto"
      version-overrides:
        description: 'JSON package-to-version overrides, e.g. {"ansys-bdm-api":"1.2.3"}.
          Only for release branch.'
        required: false
        type: string
        default: |
          {
            "ansys-bdm-api":"",
            "ansys-bdm-shared-volume":"",
            "ansys-saf-glow-engine":"",
            "ansys-saf-desktop-installer":"",
            "ansys-saf-desktop-orchestrator":"",
            "ansys-iam-oidc":"",
            "ansys-saf-product-configuration":"",
            "ansys-saf-product-manager":"",
            "ansys-saf-projects-dashboard":""
          }
  workflow_call:
    secrets:
      PYANSYS_CI_BOT_TOKEN:
        required: true
      PYANSYS_PYPI_PRIVATE_PAT:
        required: true
      PYANSYS_PYPI_PRIVATE_URL:
        required: true
      BUMP_VERSION_TOKEN:
        required: false
      PYANSYS_CI_BOT_EMAIL:
        required: false
      PYANSYS_CI_BOT_USERNAME:
        required: false
      AZURE_DEVOPS_ORG:
        required: true
      AZURE_DEVOPS_FEED:
        required: true
      AZURE_DEVOPS_PAT:
        required: true
  schedule:
    - cron: '0 0 * * 1-5'
# Apply the principle of least privilege to state at job level the right
# permissions. More information about workflow permissions in the page
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-meta-package
  cancel-in-progress: true

env:
  LIBRARY_NAME: saf-sdk
  MINIMUM_PIP_VERSION: "26.2.2" # https://github.com/pypa/pip/blob/main/NEWS.rst#2622-2026-10-20

jobs:
  run-tests-action:
    name: "Run sdk_meta_package_utilities test"
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # Read the source code of the project
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Test SDK meta-package utility
        shell: bash
        run: uv run ".github/actions/sdk-meta-package/tests/run_tests.py"

  build-meta-package:
    name: "Build Meta Package"
    runs-on: ubuntu-latest
    permissions:
      attestations: write # Write attestation for uploaded distribution artifacts
      contents: read # Read the source code of the project
      id-token: write # Write access to a temporary token for signing attestations
    env:
      GITHUB_TOKEN: ${{ secrets.PYANSYS_CI_BOT_TOKEN }} # To be set to github.token when the repositories are public
    outputs:
      update-type: ${{ steps.update-pyproject.outputs.update-type }}
      version: ${{ steps.update-pyproject.outputs.version }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/sdk-meta-package
            packages/${{ env.LIBRARY_NAME }}

      - name: Validate version overrides
        shell: bash
        env:
          VERSION_OVERRIDES: ${{ inputs.version-overrides || '{}' }}
        run: |
          if ! jq -e -s '
            [
              "ansys-bdm-api",
              "ansys-bdm-shared-volume",
              "ansys-saf-glow-engine",
              "ansys-saf-desktop-installer",
              "ansys-saf-desktop-orchestrator",
              "ansys-iam-oidc",
              "ansys-saf-product-configuration",
              "ansys-saf-product-manager",
              "ansys-saf-projects-dashboard"
            ] as $packages
            | length == 1 and all(.[];
                type == "object" and
                (keys - $packages | length == 0) and
                all(.[]; type == "string")
              )
          ' <<< "$VERSION_OVERRIDES" > /dev/null; then
            echo "::error::version-overrides must be one JSON object mapping supported package names to version strings (empty means no override)."
            exit 1
          fi

      - name: Update pyproject.toml
        id: update-pyproject
        uses: ./.github/actions/sdk-meta-package
        with:
          azure-devops-org: ${{ secrets.AZURE_DEVOPS_ORG }}
          azure-devops-feed: ${{ secrets.AZURE_DEVOPS_FEED }}
          azure-devops-pat: ${{ secrets.AZURE_DEVOPS_PAT }}
          python-version: ${{ vars.PYTHON_VERSION }}
          is-for-pypi-release: ${{ inputs.release && 'true' || 'false' }}
          minimum-pip-version: ${{ env.MINIMUM_PIP_VERSION }}
          meta-package-version-update-type: ${{ github.event_name == 'workflow_dispatch'
            && inputs.meta-package-version-update-type || 'auto' }}
          ansys-bdm-api-version-override: ${{ fromJSON(inputs.version-overrides ||
            '{}')['ansys-bdm-api'] || '' }}
          ansys-bdm-shared-volume-version-override: ${{ fromJSON(inputs.version-overrides
            || '{}')['ansys-bdm-shared-volume'] || '' }}
          ansys-saf-glow-engine-version-override: ${{ fromJSON(inputs.version-overrides
            || '{}')['ansys-saf-glow-engine'] || '' }}
          ansys-saf-desktop-installer-version-override: ${{ fromJSON(inputs.version-overrides
            || '{}')['ansys-saf-desktop-installer'] || '' }}
          ansys-saf-projects-dashboard-version-override: ${{ fromJSON(inputs.version-overrides
            || '{}')['ansys-saf-projects-dashboard'] || '' }}
          ansys-saf-desktop-orchestrator-version-override: ${{ fromJSON(inputs.version-overrides
            || '{}')['ansys-saf-desktop-orchestrator'] || '' }}
          ansys-iam-oidc-version-override: ${{ fromJSON(inputs.version-overrides ||
            '{}')['ansys-iam-oidc'] || '' }}
          ansys-saf-product-configuration-version-override: ${{ fromJSON(inputs.version-overrides
            || '{}')['ansys-saf-product-configuration'] || '' }}
          ansys-saf-product-manager-version-override: ${{ fromJSON(inputs.version-overrides
            || '{}')['ansys-saf-product-manager'] || '' }}

      - name: "Build wheel"
        uses: ansys/actions/build-library@7410037bfb276c79ae91eb3617b9f5d2876f0c94 # v11.0.8
        with:
          library-name: ${{ env.LIBRARY_NAME }}
          checkout: false
          working-directory: ${{ github.workspace }}/packages/${{ env.LIBRARY_NAME
            }}
          use-uv: true
          python-version: ${{ vars.PYTHON_VERSION }}
          attest-provenance: true
          validate-build: true'

  resolve-pyansys-references:
    name: "Resolve PyAnsys References"
    runs-on: ubuntu-latest
    outputs:
      pyansys-commit-of-main: ${{ steps.pyansys-main.outputs.pyansys-commit-of-main
        }}
    steps:
      - name: Resolve commit of PyAnsys main branch
        shell: bash
        id: pyansys-main
        run: |
          COMMIT=$(curl -s https://api.github.com/repos/ansys/pyansys/branches/main | jq -r '.commit.sha')
          echo "Latest pyansys commit on main branch: ${COMMIT}"
          echo "pyansys-commit-of-main=${COMMIT}" >> "$GITHUB_OUTPUT"

  check-wheel-can-be-poetry-installed:
    name: "Check ansys-saf-sdk can be poetry installed"
    needs:
      - build-meta-package
      - resolve-pyansys-references
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        python-version:
          - 3.11
          - 3.12
          - 3.13
          - 3.14
        runner:
          - ubuntu-latest
          - windows-latest
      fail-fast: false
    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.LIBRARY_NAME }}-artifacts
          path: wheels

      - name: Setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        shell: bash
        run: pipx install poetry==${POETRY_VERSION}
        env:
          POETRY_VERSION: ${{ vars.POETRY_VERSION }}

      - name: Configure Poetry and create new poetry project
        shell: bash
        env:
          MIN_PYTHON_VERSION: ${{ matrix.python-version == '3.11' && '3.11' || '3.12'
            }} # Set minimum Python version to test pyansys compatibility
        run: |
          poetry config virtualenvs.in-project true
          poetry new my_project --python ">=${MIN_PYTHON_VERSION},<3.15"

      - name: Add ansys-saf-sdk to poetry project
        working-directory: my_project
        shell: bash
        run: |
          WHEEL_FILE=$(ls "${GITHUB_WORKSPACE}"/wheels/*.whl)
          poetry add "ansys-saf-sdk[all] @ file://${WHEEL_FILE}"

      - name: Download additional wheels
        shell: bash
        run: |
          python -m pip download --ignore-requires-python --no-deps -d ./pim-light-server ansys-saf-pim-light-server
          python -m pip download --ignore-requires-python --no-deps -d ./translation-utilities ansys-translation-utilities
          python -m pip download --ignore-requires-python --no-deps -d ./saf-desktop-portal ansys-saf-desktop-portal
          python -m pip download --ignore-requires-python --no-deps -d ./saf-web-portal ansys-saf-web-portal
          python -m pip download --ignore-requires-python --no-deps -d ./minerva-client ansys-minerva-python-client
          python -m pip download --ignore-requires-python --no-deps -d ./datarepository ansys-datarepository-python-client
          python -m pip download --ignore-requires-python --no-deps -d ./saf-hermes ansys-saf-hermes
          python -m pip download --ignore-requires-python --no-deps -d ./aspire ansys-saf-aspire
        env:
          PIP_QUIET: 1
          PIP_INDEX_URL: https://pypi.org/simple
          PIP_EXTRA_INDEX_URL: https://PAT:${{ secrets.PYANSYS_PYPI_PRIVATE_PAT }}@${{
            secrets.PYANSYS_PYPI_PRIVATE_URL }}

      - name: Add ansys-saf-pim-light-server to poetry project
        working-directory: my_project
        shell: bash
        run: |
          WHEEL_FILE=$(ls "${GITHUB_WORKSPACE}"/pim-light-server/*.whl)
          poetry add "ansys-saf-pim-light-server[all] @ file://${WHEEL_FILE}"

      - name: Add translation-utilities to poetry project
        working-directory: my_project
        shell: bash
        run: |
          WHEEL_FILE=$(ls "${GITHUB_WORKSPACE}"/translation-utilities/*.whl)
          poetry add "ansys-translation-utilities[all] @ file://${WHEEL_FILE}"

      - name: Add saf-desktop-portal to poetry project
        working-directory: my_project
        shell: bash
        run: |
          WHEEL_FILE=$(ls "${GITHUB_WORKSPACE}"/saf-desktop-portal/*.whl)
          poetry add "ansys-saf-desktop-portal[all] @ file://${WHEEL_FILE}"

      - name: Add minerva-client to poetry project
        working-directory: my_project
        shell: bash
        run: |
          WHEEL_FILE=$(ls "${GITHUB_WORKSPACE}"/minerva-client/*.whl)
          poetry add "ansys-minerva-python-client[all] @ file://${WHEEL_FILE}"

      - name: Add datarepository to poetry project
        working-directory: my_project
        shell: bash
        run: |
          WHEEL_FILE=$(ls "${GITHUB_WORKSPACE}"/datarepository/*.whl)
          poetry add "ansys-datarepository-python-client[all] @ file://${WHEEL_FILE}"

      - name: Add saf-hermes to poetry project
        working-directory: my_project
        shell: bash
        run: |
          WHEEL_FILE=$(ls "${GITHUB_WORKSPACE}"/saf-hermes/*.whl)
          poetry add "ansys-saf-hermes[all] @ file://${WHEEL_FILE}"

      - name: Add saf-web-portal to poetry project
        working-directory: my_project
        shell: bash
        run: |
          WHEEL_FILE=$(ls "${GITHUB_WORKSPACE}"/saf-web-portal/*.whl)
          poetry add "ansys-saf-web-portal[all] @ file://${WHEEL_FILE}"

      - name: Add aspire to poetry project
        working-directory: my_project
        shell: bash
        run: |
          WHEEL_FILE=$(ls "${GITHUB_WORKSPACE}"/aspire/*.whl)
          poetry add "ansys-saf-aspire[all] @ file://${WHEEL_FILE}"

      - name: Set GRPC_PYTHON_CFLAGS for Python 3.14 on Windows
        if: matrix.python-version == '3.14' && runner.os == 'Windows'
        shell: bash
        run: |
          # grpcio-tools 1.71.2 setup.py sets both /std:c++17 and /std:c11 for MSVC.
          # The _spawn_patch.py in grpcio-tools is supposed to split them per file
          # type, but it doesn't work with newer setuptools used on Python 3.14.
          # GRPC_PYTHON_CFLAGS overrides the default flags entirely, removing /std:c11
          # to prevent the incompatible-flag error when compiling C++ files.
          echo "GRPC_PYTHON_CFLAGS=/std:c++17 /MT" >> "$GITHUB_ENV"

      - name: Add pyansys to poetry project (@latest release branch)
        if: ${{ matrix.python-version != '3.11' }} # pyansys requires Python >= 3.12
        working-directory: my_project
        shell: bash
        env:
          PYANSYS_COMMIT: ${{ needs.resolve-pyansys-references.outputs.pyansys-commit-of-main
            }}
        run: poetry add "git+https://github.com/ansys/pyansys.git@${PYANSYS_COMMIT}"
          --python ">=3.12" --extras "all"

  update-release-notes:
    name: Update release notes
    needs:
      - build-meta-package
      - resolve-pyansys-references
      - check-wheel-can-be-poetry-installed
    runs-on: ubuntu-latest
    steps:
      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: release-notes

      - name: Add PyAnsys section to the release notes
        working-directory: release-notes
        env:
          SECTION_PLACEHOLDER: '<!-- THIS LINE IS A PLACEHOLDER FOR PYANSYS COMPATIBILITY
            SECTION -->'
          COMMIT: ${{ needs.resolve-pyansys-references.outputs.pyansys-commit-of-main
            }}
        run: |
          SHORT_COMMIT=$(echo "$COMMIT" | cut -c1-7)
          ESCAPED_SECTION_PLACEHOLDER=$(printf '%s\n' "$SECTION_PLACEHOLDER" | sed 's/[][\.*^$/]/\\&/g')

          sed -i "/$ESCAPED_SECTION_PLACEHOLDER/r /dev/stdin" release_notes.md <<EOF
          ## PyAnsys compatibility

          The compatibility of this release has been tested with PyAnsys for the commit [$SHORT_COMMIT](https://github.com/ansys/pyansys/commit/${COMMIT}), from Python 3.12 to 3.14.

          Please be aware that on Windows with Python 3.14, it is required to set the \`GRPC_PYTHON_CFLAGS\` environment variable to \`/std:c++17 /MT\` before installing the packages.
          EOF

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes/release_notes.md
          if-no-files-found: error
          overwrite: true

  check-wheel-can-be-pip-installed:
    name: Check wheel can be pip installed
    needs: build-meta-package
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        python-version:
          - 3.11
          - 3.12
          - 3.13
          - 3.14
        runner:
          - ubuntu-latest
          - windows-latest
      fail-fast: false
    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.LIBRARY_NAME }}-artifacts
          path: wheels

      - name: Setup python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Pip install ansys-saf-sdk wheel
        shell: bash
        env:
          PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}
        run: |
          ${PYTHON_PATH} -m venv .venv
          if [ $RUNNER_OS == "Windows" ]; then
            . .venv/Scripts/activate
          else
            . .venv/bin/activate
          fi

          python -m pip show pip
          python -m pip install --upgrade pip==${MINIMUM_PIP_VERSION}
          WHEEL_FILE=$(ls "${GITHUB_WORKSPACE}"/wheels/*.whl)
          python -m pip install "${WHEEL_FILE}"

  tagging-commit:
    name: "Tagging commit"
    permissions:
      contents: write # Required for creating/pushing tags and commits
    needs:
      - build-meta-package
      - check-wheel-can-be-poetry-installed
      - update-release-notes
      - check-wheel-can-be-pip-installed
    if: ${{ github.ref_name == 'main' }}
    runs-on:
      - ubuntu-latest
    steps:
      - name: tagging commit
        uses: ansys/saf-devops/apply-tag-on-commit@82c48355bb8dbdaddd0e855ed383c89824ee2c3c # v1.3.3
        with:
          tag: certified-saf-sdk

  release-to-pypi:
    name: Release to PyPI
    runs-on: ubuntu-latest
    needs:
      - build-meta-package
      - check-wheel-can-be-poetry-installed
      - check-wheel-can-be-pip-installed
      - update-release-notes
    if: ${{ inputs.release }}
    environment: saf-release
    permissions:
      id-token: write # Required for OIDC authentication with PyPI
      contents: write # Required for OIDC authentication with PyPI
    env:
      RELEASE_BRANCH_NAME: "release/v${{ needs.build-meta-package.outputs.version
        }}/saf-sdk"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # required for pushing to the release branch

      - name: Create release branch
        shell: bash
        run: |
          git switch --create ${RELEASE_BRANCH_NAME}

      - name: Download pyproject.toml artifact
        if: ${{ needs.build-meta-package.outputs.update-type != 'no_update' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pyproject
          path: artifacts

      - name: Download uv lock file artifact
        if: ${{ needs.build-meta-package.outputs.update-type != 'no_update' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: uv-lock
          path: artifacts

      - name: Move pyproject.toml and uv.lock to packages/saf-sdk
        if: ${{ needs.build-meta-package.outputs.update-type != 'no_update' }}
        shell: bash
        run: |
          mv artifacts/pyproject.toml packages/saf-sdk/pyproject.toml
          mv artifacts/uv.lock packages/saf-sdk/uv.lock

      - name: Commit changes
        if: ${{ needs.build-meta-package.outputs.update-type != 'no_update' }}
        shell: bash
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add .
          git commit -m "chore: create release branch"

      - name: Push changes to release branch
        shell: bash
        run: git push origin HEAD:${RELEASE_BRANCH_NAME}

      - name: Download release notes artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: release-notes

      - name: "Download the library artifacts"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.LIBRARY_NAME }}-artifacts
          path: ${{ env.LIBRARY_NAME }}-artifacts

      - name: Create release
        id: create-release
        run: |
          gh release create ${RELEASE_NAME} "${LIBRARY_NAME}-artifacts"/*.whl \
            --title ${RELEASE_NAME} \
            --notes-file release-notes/release_notes.md \
            --latest \
            --target ${RELEASE_BRANCH_NAME} \
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: v${{ needs.build-meta-package.outputs.version }}-${{ env.LIBRARY_NAME
            }}

      - name: "Upload artifacts to PyPI using trusted publisher"
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://upload.pypi.org/legacy/
          print-hash: true
          packages-dir: ${{ env.LIBRARY_NAME }}-artifacts
          skip-existing: false

  create-pr:
    name: Update main branch with latest SAF SDK
    runs-on: ubuntu-latest
    needs:
      - build-meta-package
      - release-to-pypi
    permissions:
      contents: write # Create and push the merge branch
      pull-requests: write # Create the pull request
    environment: saf-release
    env:
      RELEASE_BRANCH_NAME: release/v${{ needs.build-meta-package.outputs.version }}/saf-sdk
      MERGE_BRANCH_NAME: chore/bump-v${{ needs.build-meta-package.outputs.version
        }}/saf-sdk
    if: ${{ github.ref_name == 'main' && needs.build-meta-package.outputs.update-type
      != 'no_update' }}
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_BRANCH_NAME }}
          fetch-depth: 0
          persist-credentials: true # required for pushing the branch

      - name: Create and push merge branch
        shell: bash
        run: |
          git switch --create "${MERGE_BRANCH_NAME}"
          git push --set-upstream origin "${MERGE_BRANCH_NAME}"

      - name: Create pull request
        shell: bash
        id: pr-info
        run: |
          git config --global user.email "${EMAIL}"
          git config --global user.name "${USERNAME}"

          pr_url=$(gh pr create \
            --base main \
            --head "${MERGE_BRANCH_NAME}" \
            --title "chore(bump): Bump saf-sdk to v${VERSION}" \
            --body "Bump the released SAF SDK version from ${RELEASE_BRANCH_NAME} into main."
          )
          echo "[pr-info] ℹ️ PR created: $pr_url"
          echo "pr-url=$pr_url" >> $GITHUB_OUTPUT

          # Extract PR number from URL
          pr_number=$(echo "$pr_url" | sed 's|.*/pull/||')
          echo "pr-number=$pr_number" >> $GITHUB_OUTPUT
        env:
          EMAIL: ${{ secrets.PYANSYS_CI_BOT_EMAIL != '' && secrets.PYANSYS_CI_BOT_EMAIL
            || 'actions@github.com' }}
          USERNAME: ${{ secrets.PYANSYS_CI_BOT_USERNAME != '' && secrets.PYANSYS_CI_BOT_USERNAME
            || 'actions' }}
          GH_TOKEN: ${{ secrets.BUMP_VERSION_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.BUMP_VERSION_TOKEN }}
          VERSION: ${{ needs.build-meta-package.outputs.version }}

      - name: Approve and Merge
        run: |
          gh pr edit "${PR_URL}" --add-label "auto-approve"
          gh pr review --approve "${PR_URL}"
          gh pr merge --auto --squash --delete-branch "${PR_URL}"
        env:
          GH_TOKEN: ${{ secrets.PYANSYS_CI_BOT_TOKEN != '' && secrets.PYANSYS_CI_BOT_TOKEN
            || github.token }}
          PR_URL: ${{ steps.pr-info.outputs.pr-url }}
