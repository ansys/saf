name: CI-CD for Release
run-name: >-
  Release: ${{ inputs.library }} (${{ inputs.dev-release && 'dev' || 'stable' }})
  by ${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      dev-release:
        description: 'Development release mode (true = prerelease flow, false = stable
          release flow)'
        type: boolean
        required: true
        default: false
      library:
        description: 'Library to release'
        type: choice
        required: true
        default: bdm-python-api
        options:
          - bdm-python-api
          - bdm-python-shared-volume
          - glow-engine
          - saf-desktop-installer
          - saf-desktop-orchestrator
          - saf-iam-oidc
          - dash-super-components
          - saf-cli
          - saf-product-configuration
          - saf-product-manager
          - saf-templates
          - saf-testing

# Apply the principle of least privilege to state at job level the right
# permissions. More information about workflow permissions in the page
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-release-${{ inputs.library }}-${{
    inputs.dev-release && 'dev' || 'stable' }}
  cancel-in-progress: true

jobs:
  validate-release-branch:
    name: Validate Release Branch and Library Match
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Extract package from release branch
        id: extract-package
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

          # Check if this is a release branch (format: release/vX.Y/package-name)
          if [[ $BRANCH_NAME =~ ^release/v[0-9]+\.[0-9]+/(.+)$ ]]; then
            PACKAGE_FROM_BRANCH="${BASH_REMATCH[1]}"
            echo "package_from_branch=$PACKAGE_FROM_BRANCH" >> $GITHUB_OUTPUT
            echo "is_release_branch=true" >> $GITHUB_OUTPUT
          else
            echo "is_release_branch=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate library matches release branch
        shell: bash
        env:
          BRANCH_NAME: ${{ steps.extract-package.outputs.branch_name }}
          PACKAGE_FROM_BRANCH: ${{ steps.extract-package.outputs.package_from_branch
            }}
          SELECTED_LIBRARY: ${{ inputs.library }}
          IS_RELEASE_BRANCH: ${{ steps.extract-package.outputs.is_release_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ] && [ "$IS_RELEASE_BRANCH" = "false" ]; then
            echo "❌ RELEASE ABORTED"
            echo ""
            echo "ERROR: Release workflow must be triggered from main or a release branch."
            echo "  Current ref: $GITHUB_REF"
            exit 1
          fi

          # Only validate if this is a release branch (not main or other branches)
          if [ "$IS_RELEASE_BRANCH" = "true" ]; then
            echo "📋 Release Branch Validation"
            echo "  Branch: $BRANCH_NAME"
            echo "  Package from branch: $PACKAGE_FROM_BRANCH"
            echo "  Selected library: $SELECTED_LIBRARY"
            echo ""

            if [ "$PACKAGE_FROM_BRANCH" != "$SELECTED_LIBRARY" ]; then
              echo "❌ RELEASE ABORTED"
              echo ""
              echo "ERROR: Selected library does not match release branch!"
              echo "  Release branch expects: $PACKAGE_FROM_BRANCH"
              echo "  But you selected: $SELECTED_LIBRARY"
              echo ""
              echo "Please trigger the release workflow again with the correct library."
              exit 1
            else
              echo "✅ Library matches release branch"
            fi
          else
            echo "⚠️  Not a release branch (branch: $BRANCH_NAME)"
            echo "Release branch validation skipped for non-release branches"
          fi

  certification:
    name: Certification
    needs: validate-release-branch
    permissions:
      security-events: read # For Dependabot alerts
      contents: write # Required for creating/pushing tags and commits
      packages: write # Allows this job to publish packages
      id-token: write # Write access to a temporary token for signing attestations
      attestations: write # Write attestation for uploaded distribution artifacts
      checks: write # Required by nested certification doc build workflow
      pull-requests: write # Required by nested certification doc build workflow
      actions: write # Required to trigger the workflow
    uses: ./.github/workflows/certification.yml
    with:
      library-name: ${{ inputs.library }}
    secrets:
      ANS_MINERVA_URL: ${{ secrets.ANS_MINERVA_URL }}
      PYANSYS_CI_BOT_TOKEN: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
      TEST_REP_CLIENT_SECRET: ${{ secrets.TEST_REP_CLIENT_SECRET }}
      PYANSYS_PYPI_PRIVATE_PAT: ${{ secrets.PYANSYS_PYPI_PRIVATE_PAT }}
      PYANSYS_PYPI_PRIVATE_URL: ${{ secrets.PYANSYS_PYPI_PRIVATE_URL }}
      LICENSE_SERVER: ${{ secrets.LICENSE_SERVER }}
      GENERATED_SOLUTION_TOKEN: ${{ secrets.GENERATED_SOLUTION_TOKEN }}

  release-information:
    name: Release Information
    needs: [validate-release-branch, certification]
    outputs:
      release-name: ${{ steps.retrieve-release-info.outputs.release-name }}
      version-to-bump-in-triggering-branch: ${{ steps.retrieve-release-info.outputs.version-to-bump-in-triggering-branch
        }}
      version-to-bump-in-release-branch: ${{ steps.retrieve-release-info.outputs.version-to-bump-in-release-branch
        }}
      version-type: ${{ steps.retrieve-release-info.outputs.version-type }}
      release-branch-name: ${{ steps.retrieve-release-info.outputs.release-branch-name
        }}/${{ inputs.library }}
      version-to-release: ${{ steps.retrieve-release-info.outputs.version-to-release
        }}
      version-major-minor: ${{ steps.retrieve-release-info.outputs.version-major-minor
        }}
    permissions:
      contents: write # Create commits to bump version
      pull-requests: write # Create pull requests to bump version
      attestations: write # Write attestation for uploaded distribution artifacts
      id-token: write # Write access to a temporary token for signing attestations
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve release information
        id: retrieve-release-info
        uses: ansys/saf-devops/retrieve-release-information@baa22e0dcc7e6598c662b4c003b2aac5b860f466 # v1.0.0
        with:
          poetry-parent-directory: packages/${{ inputs.library }}
          release-type: ${{ inputs.dev-release && 'dev' || 'stable' }}

  generate-release-notes:
    permissions:
      contents: read
      pull-requests: read # To get merged PRs for release notes generation
    name: Generate Release Notes
    needs:
      - release-information
      - certification
    if: ${{ always() && needs.certification.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate release notes
        uses: ansys/saf-devops/generate-release-notes@baa22e0dcc7e6598c662b4c003b2aac5b860f466 # v1.0.0
        with:
          tag-name: ${{ needs.release-information.outputs.release-name }}-${{ inputs.library
            }}

  prepare-release:
    permissions:
      contents: write # To create the release page in GitHub
    name: Prepare Release
    needs:
      - release-information
      - generate-release-notes
      - certification
    if: ${{ always() && needs.certification.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: ${{ inputs.dev-release && 'main' || needs.release-information.outputs.release-branch-name
        }}
      RELEASE_BRANCH_NAME: ${{ needs.release-information.outputs.release-branch-name
        }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Create release branch
        if: needs.release-information.outputs.version-type == 'dev' && !inputs.dev-release
        run: |
          git switch --create ${BRANCH_NAME}

      - name: Edit version
        if: needs.release-information.outputs.version-type == 'dev' && !inputs.dev-release
        uses: ansys/saf-devops/edit-version-in-pyproject@baa22e0dcc7e6598c662b4c003b2aac5b860f466 # v1.0.0
        with:
          pyproject-path: packages/${{ inputs.library }}/pyproject.toml
          version: ${{ needs.release-information.outputs.version-to-release }}
          checkout-repo: 'false'

      - name: Commit changes
        if: needs.release-information.outputs.version-type == 'dev' && !inputs.dev-release
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add .
          git commit -m "Auto commit changes"
          git push origin HEAD:${RELEASE_BRANCH_NAME}

      - name: Download release notes artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: release-notes

      - name: Create release
        id: create-release
        run: |
          gh release create ${RELEASE_NAME} --title ${RELEASE_NAME} --notes-file release-notes/release_notes.md ${RELEASE_LABEL} --target ${BRANCH_NAME}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ needs.release-information.outputs.release-name }}-${{
            inputs.library }}
          RELEASE_LABEL: ${{ inputs.dev-release && '--prerelease' || '--latest' }}

  doc:
    name: "Documentation"
    needs:
      - release-information
      - prepare-release
    if: ${{ always() && needs.prepare-release.result == 'success' }}
    permissions:
      contents: write # Required to push to gh-pages branch
      pull-requests: read # Required to detect doc changes
    uses: ./.github/workflows/_doc.yml
    with:
      ref: ${{ needs.release-information.outputs.release-branch-name }}
    secrets:
      PYANSYS_CI_BOT_TOKEN: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
      PYANSYS_PYPI_PRIVATE_PAT: ${{ secrets.PYANSYS_PYPI_PRIVATE_PAT }}

  build-wheel:
    name: "Wheel"
    needs:
      - release-information
      - prepare-release
      - certification
    if: ${{ always() && needs.certification.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      attestations: write # Write attestation for uploaded distribution artifacts
      contents: read # Read the source code of the project
      id-token: write # Write access to a temporary token for signing attestations
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN || github.token }}
          ref: ${{ inputs.dev-release && 'main' || needs.release-information.outputs.release-branch-name
            }}
          persist-credentials: false

      - name: "Build wheel"
        uses: ansys/actions/build-library@7410037bfb276c79ae91eb3617b9f5d2876f0c94 # v11.0.8
        with:
          library-name: ${{ inputs.library }}-${{ needs.release-information.outputs.release-name
            }}
          working-directory: packages/${{ inputs.library }}
          python-version: ${{ vars.PYTHON_VERSION }}
          attest-provenance: true
          validate-build: true
          checkout: false

  bump-version:
    name: Bump Version
    permissions:
      contents: write # Create commits to bump version
      pull-requests: write # Create pull requests to bump version
    needs:
      - release-information
      - prepare-release
      - build-wheel
      - certification
    if: ${{ always() && needs.certification.result == 'success' && github.ref == 'refs/heads/main'
      }}
    uses: ansys/saf-devops/.github/workflows/_bump_version.yml@baa22e0dcc7e6598c662b4c003b2aac5b860f466 # v1.0.0
    with:
      python-version: ${{ vars.PYTHON_VERSION }}
      poetry-version: ${{ vars.POETRY_VERSION }}
      new-version: ${{ needs.release-information.outputs.version-to-bump-in-triggering-branch
        }}
      base-ref: 'main'
      poetry-parent-directory: packages/${{ inputs.library }}
      suffix-bump-branch: "/${{ inputs.library }}"
    secrets:
      BUMP_VERSION_TOKEN: ${{ secrets.BUMP_VERSION_TOKEN }}
      PYANSYS_CI_BOT_EMAIL: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}
      PYANSYS_CI_BOT_USERNAME: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
      PYANSYS_CI_BOT_TOKEN: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}

  bump-release-branch-version:
    permissions:
      pull-requests: write # To create a PR to bump the version
      contents: write # To commit changes
    needs:
      - release-information
      - prepare-release
      - build-wheel
      - certification
    if: ${{ always() && needs.certification.result == 'success' && !inputs.dev-release
      }}
    uses: ansys/saf-devops/.github/workflows/_bump_version.yml@baa22e0dcc7e6598c662b4c003b2aac5b860f466 # v1.0.0
    with:
      python-version: ${{ vars.PYTHON_VERSION }}
      poetry-version: ${{ vars.POETRY_VERSION }}
      new-version: ${{ needs.release-information.outputs.version-to-bump-in-release-branch
        }}
      base-ref: ${{ needs.release-information.outputs.release-branch-name }}
      poetry-parent-directory: packages/${{ inputs.library }}
      suffix-bump-branch: "/${{ inputs.library }}"
    secrets:
      BUMP_VERSION_TOKEN: ${{ secrets.BUMP_VERSION_TOKEN }}
      PYANSYS_CI_BOT_EMAIL: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}
      PYANSYS_CI_BOT_USERNAME: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
      PYANSYS_CI_BOT_TOKEN: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}

  release-to-pypi:
    name: Release to PyPI
    runs-on: ubuntu-latest
    needs:
      - certification
      - release-information
      - prepare-release
      - build-wheel
    if: ${{ always() && needs.certification.result == 'success' }}
    environment: saf-release
    permissions:
      id-token: write # Required for OIDC authentication with PyPI
      contents: write # Required for OIDC authentication with PyPI
    env:
      ARTIFACT_NAME: ${{ inputs.library }}-${{ needs.release-information.outputs.release-name
        }}-artifacts
    steps:
      - name: "Download the library artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}

      - name: "Upload artifacts to PyPI using trusted publisher"
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://upload.pypi.org/legacy/
          print-hash: true
          packages-dir: ${{ env.ARTIFACT_NAME }}
          skip-existing: false
