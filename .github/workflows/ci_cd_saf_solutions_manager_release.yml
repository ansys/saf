name: Release Solutions Manager extension

# Independent of ci_cd_release.yml (Python wheels, PyPI). Publishes the tested VSIX as a GitHub Release
# asset only; Marketplace publishing is not automated.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Extension version to release (must equal extension/package.json)"
        type: string
        required: true
      prerelease:
        description: "Mark the GitHub Release as a pre-release"
        type: boolean
        required: false
        default: true

permissions: {}

concurrency:
  group: ${{ github.workflow }}-release
  cancel-in-progress: false

jobs:
  validate:
    name: "Validate version, ref and tag"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release request
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "'${VERSION}' is not a valid semantic version."
            exit 1
          fi

          manifest_version="$(node -p "require('./extension/package.json').version")"
          if [ "${manifest_version}" != "${VERSION}" ]; then
            echo "Requested version ${VERSION} does not match extension/package.json (${manifest_version})."
            exit 1
          fi

          case "${GITHUB_REF}" in
            refs/heads/main|refs/heads/release/*) ;;
            *)
              echo "Releases must run from main or release/**, not ${GITHUB_REF}."
              exit 1
              ;;
          esac

          tag="saf-solutions-manager-v${VERSION}"
          existing="$(gh api "repos/${REPO}/git/ref/tags/${tag}" --jq '.object.sha' 2>/dev/null || true)"
          if [ -n "${existing}" ] && [ "${existing}" != "${GITHUB_SHA}" ]; then
            echo "Tag ${tag} already points at ${existing}, not ${GITHUB_SHA}."
            exit 1
          fi

  certify:
    name: "Certify"
    needs: validate
    permissions:
      contents: write # Required by the nested tag job of the certification workflow, which stays skipped here
    uses: ./.github/workflows/saf_solutions_manager_certification.yml
    with:
      create-tag: false

  release:
    name: "Create GitHub Release"
    needs:
      - validate
      - certify
    runs-on: ubuntu-latest
    environment: saf-solutions-manager-release
    permissions:
      contents: write # Create the release and upload the VSIX asset
    env:
      VERSION: ${{ inputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Download VSIX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.certify.outputs.vsix-artifact-name }}
          path: ${{ runner.temp }}/vsix

      - name: Create release and upload VSIX
        shell: bash
        run: |
          set -euo pipefail
          tag="saf-solutions-manager-v${VERSION}"
          vsix="${RUNNER_TEMP}/vsix/solutions-manager-${VERSION}.vsix"
          test -f "${vsix}"

          if ! gh release view "${tag}" --repo "${REPO}" >/dev/null 2>&1; then
            args=(--repo "${REPO}" --target "${GITHUB_SHA}" --title "Solutions Manager ${VERSION}" --generate-notes --latest=false)
            if [ "${PRERELEASE}" = "true" ]; then
              args+=(--prerelease)
            fi
            gh release create "${tag}" "${args[@]}"
          fi

          # --clobber makes retries idempotent.
          gh release upload "${tag}" "${vsix}" --repo "${REPO}" --clobber
