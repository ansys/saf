name: Certify Solutions Manager extension

# Separate from certification.yml, which is specific to Python packages (Python versions, pytest
# groups, wheels, certified-<library> tags).

on:
  workflow_dispatch:
    inputs:
      create-tag:
        description: "Create the certified-saf-solutions-manager-v<version> tag when
          all checks pass"
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      create-tag:
        description: "Create the certified-saf-solutions-manager-v<version> tag when
          all checks pass"
        type: boolean
        required: false
        default: false
    outputs:
      vsix-artifact-name:
        description: "Name of the workflow artifact that contains the VSIX"
        value: ${{ jobs.checks.outputs.vsix-artifact-name }}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-certification
  cancel-in-progress: true

jobs:
  checks:
    name: "Extension checks"
    permissions:
      contents: read
    uses: ./.github/workflows/_saf_solutions_manager.yml
    with:
      use-npm-cache: false

  supply-chain:
    name: "Dependency audit, licenses and SBOM"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: extension
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: extension/.nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check production dependency licenses
        run: node scripts/check-licenses.mjs

      - name: Generate SBOM
        run: npm sbom --sbom-format cyclonedx --omit dev > "${RUNNER_TEMP}/saf-solutions-manager-sbom.json"

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-saf-solutions-manager
          path: ${{ runner.temp }}/saf-solutions-manager-sbom.json
          overwrite: true
          if-no-files-found: error

  summary:
    name: "Certification summary"
    needs:
      - checks
      - supply-chain
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    env:
      CHECKS_RESULT: ${{ needs.checks.result }}
      SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
    steps:
      - name: Write summary
        shell: bash
        run: |
          {
            echo "### Solutions Manager extension certification"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Type-check, lint, unit, integration and VSIX packaging | ${CHECKS_RESULT} |"
            echo "| npm audit, licenses and SBOM | ${SUPPLY_CHAIN_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any check failed
        if: env.CHECKS_RESULT != 'success' || env.SUPPLY_CHAIN_RESULT != 'success'
        shell: bash
        run: |
          echo "Certification failed."
          exit 1

  tag:
    name: "Create certification tag"
    needs:
      - checks
      - supply-chain
      - summary
    if: ${{ inputs.create-tag && needs.summary.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the certification tag
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create certification tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./extension/package.json').version")"
          tag="certified-saf-solutions-manager-v${version}"
          existing="$(gh api "repos/${REPO}/git/ref/tags/${tag}" --jq '.object.sha' 2>/dev/null || true)"
          if [ -z "${existing}" ]; then
            gh api --method POST "repos/${REPO}/git/refs" -f "ref=refs/tags/${tag}" -f "sha=${GITHUB_SHA}"
          elif [ "${existing}" != "${GITHUB_SHA}" ]; then
            echo "Tag ${tag} already points at ${existing}, not ${GITHUB_SHA}."
            exit 1
          fi
