title = "Custom Gitleaks Rule for Private Azure PyPI Feeds"

[extend]
useDefault = true

[[rules]]
id = "private-azure-pypi-url"
description = "Detected a reference or link to a private Azure Artifacts PyPI feed."
# This regex catches both the standard feed format and the simple index format
regex = '''pkgs\.dev\.azure\.com/[a-zA-Z0-9_\-]+/.*_packaging/'''
keywords = [
    "pkgs.dev.azure.com",
    "_packaging"
]

[[allowlists]]
description = "Allow the dummy Keycloak test secret"
paths = ['''^packages/saf-testing/src/ansys/saf/testing/_hps/scripts/keycloak/\.env$''']
regexTarget = "line"
regexes = ['''^KC_CLIENT_SECRET=FRJILPV9NVKIAfcQqOtlkjo8inR5eVMWHyfNmlisLDw=\s*$''']