# Root-level project for tasks that must run once for the whole workspace,
# instead of once per package. See https://moonrepo.dev/docs/guides/root-project
workspace:
  inheritedTasks:
    include: []

tasks:
  uv-sync:
    command: "uv"
    args:
      - "sync"
      - "--quiet"
    inputs:
      - "/pyproject.toml"
      - "/uv.lock"
    outputs:
      - "/.venv"
    options:
      runFromWorkspaceRoot: true

  gitleaks:
    description: "Scan branch-changed tracked files with Gitleaks"
    command: "uv"
    args:
      - "run"
      - "python"
      - "-c"
      - >-
        import os, subprocess, sys;
        from pre_commit.main import main;
        base_ref = os.environ.get("GITLEAKS_BASE_REF", "origin/main");
        base = subprocess.check_output(["git", "merge-base", "HEAD", base_ref], text=True).strip();
        os.environ["GITLEAKS_LOG_OPTS"] = base + "..HEAD";
        print(f"Gitleaks: scanning commit history from {base_ref} to HEAD", flush=True);
        history_result = main(["run", "gitleaks", "--files", ".gitleaks.toml"]);
        os.environ.pop("GITLEAKS_LOG_OPTS");
        files = subprocess.check_output(
        ["git", "diff", "--name-only", "--diff-filter=ACMRT", "-z", base, "--"],
        text=True, encoding="utf-8", errors="surrogateescape").split(chr(0))[:-1];
        print(f"Gitleaks: scanning current contents of {len(files)} changed tracked files", flush=True);
        working_tree_result = main(["run", "gitleaks", "--files", *files]) if files else 0;
        sys.exit(max(history_result, working_tree_result))
    inputs:
      - '/.pre-commit-config.yaml'
      - '/.gitleaks.toml'
      - '/pyproject.toml'
      - '/uv.lock'
    options:
      cache: false
      shell: false
      runFromWorkspaceRoot: true
      mutex: 'pre-commit'

  pre-commit:
    description: "Run pre-commit against root-level files only (packages run their
      own pre-commit task)"
    deps:
      - '~:gitleaks'
    script: 'uv run pre-commit run --files $(git ls-files -- ":(top,glob)*" ":(top).github/**"
      ":(top)doc/**")'
    inputs:
      - '/.pre-commit-config.yaml'
      - '/pyproject.toml'
      - '/uv.lock'
      - '/.github/**/*'
      - '/doc/**/*'
    options:
      runFromWorkspaceRoot: true
      # Shared pre-commit hook envs aren't safe for concurrent invocation across projects.
      mutex: 'pre-commit'

  build-doc:
    description: "Build general documentation"
    command: 'uv'
    args:
      - "run"
      - "sphinx-build"
      - "-M"
      - "html"
      - "doc/source"
      - "doc/_build"
      - "-j"
      - "auto"
      - "--keep-going"
      - "-v"
    env:
      DISABLE_INTERSPHINX: 'true'
    inputs:
      - "doc/**/*"
      - "pyproject.toml"
    options:
      runFromWorkspaceRoot: true

  download-wheel-for-e2e-tests:
    description: "Download the private wheels required by the e2e tests into <workspace
      root>/extra_packages"
    command: 'pip'
    args:
      - "download"
      - "--pre"
      - "--no-deps"
      - "ansys-saf-aspire"
      - "ansys-saf-desktop-portal"
      - "-d"
      - "./extra_packages"
    outputs:
      - "/extra_packages"
    env:
      PIP_INDEX_URL: 'https://pypi.org/simple'
      PIP_QUIET: '1'
    options:
      runFromWorkspaceRoot: true
      # Never cache: the resolved wheels depend on ambient index configuration
      # (PIP_EXTRA_INDEX_URL for the Ansys private PyPI), which moon does not hash.
      # A cache hit would silently restore the public placeholder wheels.
      cache: false

  clean-hps-log:
    description: "Clean HPS log files"
    command: 'rm'
    args:
      - '-rf'
      - '~/.ansys/rep/scaling/*'
      - '/tmp/hps_*'
    options:
      shell: true
      # Ensures the entire moon pipeline won't fail if the directories don't exist
      allowFailure: true 
    toolchains:
      - 'system'