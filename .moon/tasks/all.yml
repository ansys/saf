tasks:
  check-env-var:
    command: pwsh
    args:
      - -NoProfile
      - -NonInteractive
      - -CommandWithArgs
      - 'if ($args.Count -eq 0) { Write-Error "Specify at least one environment variable name"; exit 1 }; foreach ($name in $args) { if ([string]::IsNullOrEmpty($name) -or [string]::IsNullOrEmpty([Environment]::GetEnvironmentVariable($name))) { Write-Error "Required environment variable is not set: $name"; exit 1 } }'
    options:
      shell: false
      cache: false

  install-private-dependency:
    command: "uv"
    args:
      - "pip"
      - "install"
      - "--pre"
      - "--no-deps"
      # The value passed via args: ["ansys-saf-aspire==9.1.6"] will naturally append here
    deps:
      - target: "~:check-env-var"
        args: ["UV_EXTRA_INDEX_URL"]
    env:
      PIP_INDEX_URL: "https://pypi.org/simple"
      PIP_QUIET: "1"
    options:
      cache: false

  install-pim-light-server:
    deps:
      - target: "~:install-private-dependency"
        args:
          - "ansys-saf-pim-light-server==0.3.12"

  install-ansys-saf-aspire:
    deps:
      - target: "~:install-private-dependency"
        args:
          - "ansys-saf-aspire==9.1.6"

  install-saf-desktop-portal:
    deps:
      - target: "~:install-private-dependency"
        args:
          - "ansys-saf-desktop-portal==0.4.dev2"

  pre-commit:
    description: "Run pre-commit against this package's files only (root-level files
      are handled by root:pre-commit)"
    script: 'uv run pre-commit run --files $(git ls-files -- ":(top,glob)$projectSource/**")'
    deps:
      - '~:pyright'
      - '~:ruff'
      - '~:ruff-format'
      - '~:bandit'
      - target: "~:check-env-var"
        args: 
          - "UV_PYTHON"
          - "MOON_PYTHON_VERSION"
    inputs:
      - 'src/**/*'
      - 'tests/**/*'
      - '/.pre-commit-config.yaml'
      - 'pyproject.toml'
      - '/.uv.lock'
    options:
      runFromWorkspaceRoot: true
      # Shared pre-commit hook envs aren't safe for concurrent invocation across projects.
      mutex: 'pre-commit'

  pyright:
    description: "Run pyright"
    deps:
      - target: "~:check-env-var"
        args: 
          - "UV_PYTHON"
          - "MOON_PYTHON_VERSION"
    command:
      - "uv"
      - "run"
      - "--package"
      - "$projectAlias"
      - "--all-extras"
      - "pyright"
      - "$projectSource"
    inputs:
      - "src/**/*"
      - "tests/**/*"
      - "pyproject.toml"
    options:
      runFromWorkspaceRoot: true

  ruff:
    description: "Run ruff check"
    deps:
      - target: "~:check-env-var"
        args: 
          - "UV_PYTHON"
          - "MOON_PYTHON_VERSION"
    command:
      - "uv"
      - "run"
      - "--package"
      - "$projectAlias"
      - "--all-extras"
      - "ruff"
      - "check"
      - "$projectSource"
    inputs:
      - "src/**/*"
      - "tests/**/*"
      - "pyproject.toml"
    options:
      runFromWorkspaceRoot: true

  ruff-fix:
    description: "Run ruff fix"
    deps:
      - target: "~:check-env-var"
        args: 
          - "UV_PYTHON"
          - "MOON_PYTHON_VERSION"
    command:
      - "uv"
      - "run"
      - "--package"
      - "$projectAlias"
      - "--all-extras"
      - "ruff"
      - "check"
      - "--fix"
      - "$projectSource"
    inputs:
      - "src/**/*"
      - "tests/**/*"
      - "pyproject.toml"
    options:
      runFromWorkspaceRoot: true

  ruff-format:
    deps:
      - target: "~:check-env-var"
        args: 
          - "UV_PYTHON"
          - "MOON_PYTHON_VERSION"
    description: "Run ruff format"
    command:
      - "uv"
      - "run"
      - "--package"
      - "$projectAlias"
      - "--all-extras"
      - "ruff"
      - "format"
      - "--diff"
      - "$projectSource"
    inputs:
      - "src/**/*"
      - "tests/**/*"
      - "pyproject.toml"
    options:
      runFromWorkspaceRoot: true

  bandit:
    deps:
      - target: "~:check-env-var"
        args: 
          - "UV_PYTHON"
          - "MOON_PYTHON_VERSION"
    description: "Run bandit"
    command:
      - "uv"
      - "run"
      - "--package"
      - "$projectAlias"
      - "--all-extras"
      - "bandit"
      - "-r"
      - "$projectSource/src"
      - "--severity-level=high"
    inputs:
      - "src/**/*"
      - "tests/**/*"
      - "pyproject.toml"
    tags:
      - "ubuntu-latest"
    options:
      runFromWorkspaceRoot: true

  build:
    description: "Build wheel"
    deps:
      - target: "~:check-env-var"
        args: 
          - "UV_PYTHON"
          - "MOON_PYTHON_VERSION"
    command:
      - "uv"
      - "build"
      - "--package"
      - "$projectAlias"
    inputs:
      - "src/**/*"
      - "pyproject.toml"
    outputs:
      - "/dist"
    tags:
      - "ubuntu-latest"
    options:
      runFromWorkspaceRoot: true

  twine-check:
    description: "Check distribution with twine"
    deps:
      - target: "~:check-env-var"
        args: 
          - "UV_PYTHON"
          - "MOON_PYTHON_VERSION"
    command: "uvx"
    args:
      - "twine@7.0.0"
      - "check"
      - "dist/*.whl"
      - "dist/*.tar.gz"
    inputs:
      - "dist/*.whl"
      - "dist/*.tar.gz"
    options:
      runFromWorkspaceRoot: true

  test:
    deps:
      - target: "~:check-env-var"
        args: 
          - "UV_PYTHON"
          - "MOON_PYTHON_VERSION"
    description: "Run pytest"
    command: 'uv'
    args:
      - "run"
      - "--package"
      - "$projectAlias"
      - "--all-extras"
      - "pytest"
      - "-p"
      - "no:faulthandler"
      - "$args"
      - "-s" # Disable capturing of stdout and stderr during tests
    env:
      PYTHONUNBUFFERED: '1'
      SAF_EXTRA_PACKAGES_DIR: 'extra_packages'
    options:
      outputStyle: "stream"
    inputs:
      - "src/**/*"
      - "tests/**/*"
      - "pyproject.toml"
      - "/uv.lock"
      - "/extra_packages/**/*"

  build-doc:
    description: "Build API documentation"
    deps:
      - target: "~:check-env-var"
        args: 
          - "UV_PYTHON"
          - "MOON_PYTHON_VERSION"
    command: 'uv'
    args:
      - "run"
      - "sphinx-build"
      - "-M"
      - "html"
      - "$projectSource/doc/source"
      - "$projectSource/doc/_build"
      - "-j"
      - "auto"
      - "--keep-going"
      - "-v"
    env:
      DISABLE_INTERSPHINX: 'true'
    inputs:
      - "doc/**/*"
      - "pyproject.toml"
    options:
      runFromWorkspaceRoot: true

  export:
    description: "Export the project"
    deps:
      - target: "~:check-env-var"
        args: 
          - "UV_PYTHON"
          - "MOON_PYTHON_VERSION"
    command: 'uv'
    args:
      - "export"
      - "--package"
      - "$projectAlias"
      - "--no-emit-workspace"
      - "--no-hashes"
      - "--format"
      - "requirements-txt"
      - "--output-file"
      - "dist/$projectSource-requirements.txt"
    inputs:
      - "src/**/*"
      - "pyproject.toml"
      - "uv.lock"
    outputs:
      - "/dist/$projectSource-requirements.txt"
    options:
      runFromWorkspaceRoot: true

  sbom:
    description: "Export sbom"
    deps:
      - target: "~:check-env-var"
        args: 
          - "UV_PYTHON"
          - "MOON_PYTHON_VERSION"
    command: 'uv'
    args:
      - "export"
      - "--package"
      - "$projectAlias"
      - "--format"
      - "cyclonedx1.5"
      - "--output-file"
      - "dist/$projectSource-sbom.json"
      - "--preview-features"
      - "sbom-export"
    inputs:
      - "src/**/*"
      - "pyproject.toml"
      - "/uv.lock"
    outputs:
      - "/dist/$projectSource-sbom.json"
    options:
      runFromWorkspaceRoot: true

  vulnerability-check:
    description: "Audit production dependencies for known vulnerabilities"
    deps:
      - '~:export'
      - target: "~:check-env-var"
        args: 
          - "UV_PYTHON"
          - "MOON_PYTHON_VERSION"
    command: 'uvx'
    args:
      - "--from"
      - "pip-audit==2.10.1"
      - "pip-audit"
      - "--requirement"
      - "dist/$projectSource-requirements.txt"
      - "--desc"
      - "on"
      - "--strict"
    env:
      UV_MALWARE_CHECK: '1'
    inputs:
      - "pyproject.toml"
      - "/pyproject.toml"
      - "/uv.lock"
      - "dist/$projectSource-requirements.txt"
    options:
      runFromWorkspaceRoot: true
