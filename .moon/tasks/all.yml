tasks:
  check-env-var:
    description: "Check that required environment variables are set"
    command: 'uv'
    args:
      - "run"
      - "python"
      - '-c'
      - >-
        import os, sys;
        names = sys.argv[1:];
        missing = next((name for name in names if not os.environ.get(name)), None);
        message = "Error: Specify at least one environment variable name" if not names else
        f"Error: Required environment variable is not set: {missing}" if missing is not None else None;
        print(message, file=sys.stderr) if message is not None else None;
        sys.exit(1 if message is not None else 0)
    options:
      cache: false

  install-private-dependency:
    command: "uv"
    args:
      - "pip"
      - "install"
      - "--pre"
      - "--no-deps"
      # The value passed via args: ["ansys-saf-aspire==9.1.6"] will naturally append here
    deps:
      - target: "~:check-env-var"
        args: ["UV_EXTRA_INDEX_URL"]
    env:
      PIP_INDEX_URL: "https://pypi.org/simple"
      PIP_QUIET: "1"
    options:
      cache: false

  install-pim-light-server:
    description: "Install the ANSYS SAF PIM Light Server package"
    deps:
      - target: "~:install-private-dependency"
        args:
          - "ansys-saf-pim-light-server==0.3.12"

  install-ansys-saf-aspire:
    description: "Install the ANSYS SAF Aspire package"
    deps:
      - target: "~:install-private-dependency"
        args:
          - "ansys-saf-aspire==9.1.6"

  install-saf-desktop-portal:
    description: "Install the ANSYS SAF Desktop Portal package"
    deps:
      - target: "~:install-private-dependency"
        args:
          - "ansys-saf-desktop-portal==0.4.dev2"

  install-visor:
    description: "Install the ANSYS Visor Viewer package"
    deps:
      - target: "~:install-private-dependency"
        args:
          - "ansys-visor-viewer==1.0.5b0.dev0+20260831"

  install-minerva-python-client:
    description: "Install the ANSYS Minerva Python Client package"
    deps:
      - target: "~:install-private-dependency"
        args:
          - "ansys-minerva-python-client==0.3.1"

  hps-installer:
    description: "Install HPS"
    command: "uv"
    args:
      - "run"
      - "--project"
      - "$workspaceRoot"
      - "python"
      - "-m"
      - "ansys.saf.testing.hps.scripts.hps_installer"
    options:
      cache: false

  pre-commit:
    description: "Run pre-commit against this package's files only (root-level files
      are handled by root:pre-commit)"
    command: 'uv'
    args:
      - 'run'
      - 'python'
      - '-c'
      - >-
        import subprocess, sys;
        from pre_commit.main import main;
        files = subprocess.check_output(
        ['git', 'ls-files', '-z', '--', f':(top,glob){sys.argv[1]}/**'],
        text=True, encoding='utf-8', errors='surrogateescape').split(chr(0))[:-1];
        sys.exit(main(['run', '--files', *files]))
      - '$projectSource'
    deps:
      - '~:pyright'
      - '~:ruff'
      - '~:ruff-format'
      - '~:bandit'
      - target: "~:check-env-var"
        args: 
          - "UV_PYTHON"
          - "MOON_PYTHON_VERSION"
    inputs:
      - 'src/**/*'
      - 'tests/**/*'
      - '/.pre-commit-config.yaml'
      - 'pyproject.toml'
      - '/.uv.lock'
    options:
      shell: false
      runFromWorkspaceRoot: true
      # Shared pre-commit hook envs aren't safe for concurrent invocation across projects.
      mutex: 'pre-commit'

  pyright:
    description: "Run pyright"
    deps:
      - target: "~:check-env-var"
        args: 
          - "UV_PYTHON"
          - "MOON_PYTHON_VERSION"
    command:
      - "uv"
      - "run"
      - "--package"
      - "$projectAlias"
      - "--all-extras"
      - "pyright"
      - "$projectSource"
    inputs:
      - "src/**/*"
      - "tests/**/*"
      - "pyproject.toml"
    options:
      runFromWorkspaceRoot: true

  ruff:
    description: "Run ruff check"
    deps:
      - target: "~:check-env-var"
        args: 
          - "UV_PYTHON"
          - "MOON_PYTHON_VERSION"
    command:
      - "uv"
      - "run"
      - "--package"
      - "$projectAlias"
      - "--all-extras"
      - "ruff"
      - "check"
      - "$projectSource"
    inputs:
      - "src/**/*"
      - "tests/**/*"
      - "pyproject.toml"
    options:
      runFromWorkspaceRoot: true

  ruff-fix:
    description: "Run ruff fix"
    deps:
      - target: "~:check-env-var"
        args: 
          - "UV_PYTHON"
          - "MOON_PYTHON_VERSION"
    command:
      - "uv"
      - "run"
      - "--package"
      - "$projectAlias"
      - "--all-extras"
      - "ruff"
      - "check"
      - "--fix"
      - "$projectSource"
    inputs:
      - "src/**/*"
      - "tests/**/*"
      - "pyproject.toml"
    options:
      runFromWorkspaceRoot: true

  ruff-format:
    deps:
      - target: "~:check-env-var"
        args: 
          - "UV_PYTHON"
          - "MOON_PYTHON_VERSION"
    description: "Run ruff format"
    command:
      - "uv"
      - "run"
      - "--package"
      - "$projectAlias"
      - "--all-extras"
      - "ruff"
      - "format"
      - "--diff"
      - "$projectSource"
    inputs:
      - "src/**/*"
      - "tests/**/*"
      - "pyproject.toml"
    options:
      runFromWorkspaceRoot: true

  bandit:
    deps:
      - target: "~:check-env-var"
        args: 
          - "UV_PYTHON"
          - "MOON_PYTHON_VERSION"
    description: "Run bandit"
    command:
      - "uv"
      - "run"
      - "--package"
      - "$projectAlias"
      - "--all-extras"
      - "bandit"
      - "-r"
      - "$projectSource/src"
      - "--severity-level=high"
    inputs:
      - "src/**/*"
      - "tests/**/*"
      - "pyproject.toml"
    tags:
      - "ubuntu-latest"
    options:
      runFromWorkspaceRoot: true

  build:
    description: "Build wheel"
    deps:
      - target: "~:check-env-var"
        args: 
          - "UV_PYTHON"
          - "MOON_PYTHON_VERSION"
    command:
      - "uv"
      - "build"
      - "--package"
      - "$projectAlias"
    inputs:
      - "src/**/*"
      - "pyproject.toml"
    outputs:
      - "/dist"
    tags:
      - "ubuntu-latest"
    options:
      runFromWorkspaceRoot: true

  twine-check:
    description: "Check distribution with twine"
    deps:
      - target: "~:check-env-var"
        args: 
          - "UV_PYTHON"
          - "MOON_PYTHON_VERSION"
    command: "uvx"
    args:
      - "twine@7.0.0"
      - "check"
      - "dist/*.whl"
      - "dist/*.tar.gz"
    inputs:
      - "dist/*.whl"
      - "dist/*.tar.gz"
    options:
      runFromWorkspaceRoot: true

  test:
    deps:
      - target: "~:check-env-var"
        args: 
          - "UV_PYTHON"
          - "MOON_PYTHON_VERSION"
    description: "Run pytest"
    command: 'uv'
    args:
      - "run"
      - "--package"
      - "$projectAlias"
      - "--all-extras"
      - "pytest"
      - "--cov=."
      - "--cov-report=term"
      - "--cov-report=xml"
      - "--cov-report=html"
      - "-p"
      - "no:faulthandler"
      - "-s" # Disable capturing of stdout and stderr during tests
    env:
      PYTHONUNBUFFERED: '1'
      SAF_EXTRA_PACKAGES_DIR: 'extra_packages'
    options:
      outputStyle: "stream"
    inputs:
      - "src/**/*"
      - "tests/**/*"
      - "pyproject.toml"
      - "/uv.lock"
      - "/extra_packages/**/*"

  build-doc:
    description: "Build API documentation"
    deps:
      - target: "~:check-env-var"
        args: 
          - "UV_PYTHON"
          - "MOON_PYTHON_VERSION"
    command: 'uv'
    args:
      - "run"
      - "sphinx-build"
      - "-M"
      - "html"
      - "$projectSource/doc/source"
      - "$projectSource/doc/_build"
      - "-j"
      - "auto"
      - "--keep-going"
      - "-v"
    env:
      DISABLE_INTERSPHINX: 'true'
    inputs:
      - "doc/**/*"
      - "pyproject.toml"
    options:
      runFromWorkspaceRoot: true

  export:
    description: "Export the project"
    deps:
      - target: "~:check-env-var"
        args: 
          - "UV_PYTHON"
          - "MOON_PYTHON_VERSION"
    command: 'uv'
    args:
      - "export"
      - "--package"
      - "$projectAlias"
      - "--no-emit-workspace"
      - "--no-hashes"
      - "--format"
      - "requirements-txt"
      - "--output-file"
      - "dist/$projectSource-requirements.txt"
    inputs:
      - "src/**/*"
      - "pyproject.toml"
      - "uv.lock"
    outputs:
      - "/dist/$projectSource-requirements.txt"
    options:
      runFromWorkspaceRoot: true

  sbom:
    description: "Export sbom"
    deps:
      - target: "~:check-env-var"
        args: 
          - "UV_PYTHON"
          - "MOON_PYTHON_VERSION"
    command: 'uv'
    args:
      - "export"
      - "--package"
      - "$projectAlias"
      - "--format"
      - "cyclonedx1.5"
      - "--output-file"
      - "dist/$projectSource-sbom.json"
      - "--preview-features"
      - "sbom-export"
    inputs:
      - "src/**/*"
      - "pyproject.toml"
      - "/uv.lock"
    outputs:
      - "/dist/$projectSource-sbom.json"
    options:
      runFromWorkspaceRoot: true

  vulnerability-check:
    description: "Audit production dependencies for known vulnerabilities"
    deps:
      - '~:export'
      - target: "~:check-env-var"
        args: 
          - "UV_PYTHON"
          - "MOON_PYTHON_VERSION"
    command: 'uvx'
    args:
      - "--from"
      - "pip-audit==2.10.1"
      - "pip-audit"
      - "--requirement"
      - "dist/$projectSource-requirements.txt"
      - "--desc"
      - "on"
      - "--strict"
    env:
      UV_MALWARE_CHECK: '1'
    inputs:
      - "pyproject.toml"
      - "/pyproject.toml"
      - "/uv.lock"
      - "dist/$projectSource-requirements.txt"
    options:
      runFromWorkspaceRoot: true
