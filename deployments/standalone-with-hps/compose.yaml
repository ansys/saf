name: ${APP_NAME}

networks:
  internal:
    name: ${APP_NAME}-internal
    internal: true
  external:
    name: ${APP_NAME}-external
    driver: bridge
  external-network:
    external: true
    name: ${EXT_NETWORK_NAME}

services:
  postgresql:
    image: postgres:16.0
    networks:
      - internal
    environment:
      - POSTGRES_USER=glow
      - POSTGRES_PASSWORD=glow
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "glow" ]
      interval: 5s
      retries: 20
    volumes:
      - database:/var/lib/postgresql/data

  api:
    image: ${APP_NAME}-api
    build:
      context: ../../
      dockerfile: deployments/Dockerfile
      target: solution_api
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      external:
        aliases:
          - ${APP_NAME}-api
      internal:
      external-network:
        aliases:
          - ${APP_NAME}-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    init: true # to ensure reaping of killed child processes left by long-running transactions
    environment:
      - GLOW_DEPLOYMENT=DockerCompose
      - GLOW_API_HOST=0.0.0.0
      - GLOW_API_PORT=50000
      - GLOW_DATABASE_TYPE=postgresql
      - GLOW_DATABASE_LOCATION=postgresql://glow:glow@postgresql:5432
      - GLOW_PROJECT_FILES_DIRECTORY=/projects
      - GLOW_METHOD_EXECUTION_DIRECTORY=/transactions
      - GLOW_EXTERNAL_API_URL=http://127.0.0.1:${GLOW_API_CONTAINER_PORT}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
    ports:
      - ${GLOW_API_CONTAINER_PORT}:50000
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:50000/health" ]
      interval: 5s
      retries: 20
    volumes:
      - ${GLOW_PROJECTS_DIR_SOLUTION}:/projects
      - ${GLOW_TRANSACTIONS_DIR_SOLUTION}:/transactions
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_NAME}-api.rule=Host(`${ACCESS_URL}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.${APP_NAME}-api.entrypoints=web,external"
      - "traefik.http.middlewares.${APP_NAME}-api-stripprefix.stripprefix.prefixes=/api"
      - "traefik.http.routers.${APP_NAME}-api.middlewares=${APP_NAME}-api-stripprefix"
      - "traefik.http.routers.${APP_NAME}-api.service=${APP_NAME}-api"
      - "traefik.http.services.${APP_NAME}-api.loadbalancer.server.port=50000"
      - "traefik.http.routers.${APP_NAME}-api.tls=true"
      - "traefik.docker.network=${EXT_NETWORK_NAME}"
    develop:
      watch:
        - action: sync+restart
          path: /src/saf/solutions/solutionb2b47ed/solution
          target: /app/src/saf/solutions/solutionb2b47ed/solution



  otel-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.1.0
    ports:
      - 18888:18888 # UI
      - 18889:18889 # OTLP gRPC
      - 18890:18890 # OTLP HTTP
    environment:
      - DASHBOARD__OTLP__AUTHMODE=ApiKey
      # !!! Important !!! For production, replace the following env var with secure values
      # as described here: https://aspire.dev/dashboard/security-considerations/
      - DASHBOARD__FRONTEND__AUTHMODE=Unsecured
      - DASHBOARD__OTLP__PRIMARYAPIKEY=YOU_MUST_GENERATE_A_RANDOM_STRING_AND_REPLACE_THIS
    networks:
      - external
      - external-network

volumes:
  database:
    name: ${APP_NAME}-database
