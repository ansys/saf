# Core settings
# =============


# Location of our `styles`
StylesPath = styles

# The options are `suggestion`, `warning`, or `error` (defaults to “warning”).
MinAlertLevel = error

# By default, `code` and `tt` are ignored.
IgnoredScopes = code, tt


# By default, `script`, `style`, `pre`, and `figure` are ignored.
SkippedScopes = script, style, pre, figure

# WordTemplate specifies what Vale will consider to be an individual word.
WordTemplate = \b(?:%s)\b

# List of Packages to be used for our guidelines
Packages = Google

# Define the Ansys vocabulary
Vocab = ANSYS

[*.{md,rst}]

# Ignore fenced code blocks and reStructuredText code blocks
BlockIgnores = (?s)```.*?```|(?ms)^.. code-block::.*?\n(?:[ \t]+.*\n?)+

# Ignore reST interpreted text roles, e.g. :class:`...`, :attr:`...`, :meth:`...`, :ref:`...`,
# :py:class:`...`. Their content is a Python identifier/path, not prose, and should not be
# checked by sentence-spacing or spelling rules.
TokenIgnores = (:[a-zA-Z0-9_]+(?::[a-zA-Z0-9_]+)*:`.*?`)|(\.\. image:: .*)

# Apply the following styles
BasedOnStyles = Vale, Google

# The docs intentionally use an em dash surrounded by spaces (e.g., tutorial phase headings
# like "Phase 5 — Package"), so this Google style rule is disabled.
Google.EmDash = NO
