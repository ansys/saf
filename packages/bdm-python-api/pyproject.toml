[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12.18,<0.13" ]

[project]
name = "ansys-bdm-api"
version = "0.6.dev0"
description = "Python API for BDM"
readme = "README.rst"
license = "Apache-2.0"
license-files = [ "LICENSE" ]
maintainers = [ { name = "ANSYS, Inc.", email = "pyansys-core@synopsys.com" } ]
authors = [ { name = "ANSYS, Inc.", email = "pyansys-core@synopsys.com" } ]
requires-python = ">=3.11,<4"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "aioshutil>=1.3,<2",
  "anyio>=3.7.1,<5",
  "pydantic>=2.3,<3",
]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--import-mode=importlib",
]
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.12"
extraPaths = [ "src" ]
include = [ "src", "tests" ]
exclude = [ "**/*_pb2.py", "**/*_pb2_grpc.py" ]
strict = [ "src", "tests" ]
venvPath = "../.."
venv = ".venv"

[tool.uv.sources]
ansys-bdm-api = { workspace = true }

[tool.uv.build-backend]
module-name = "ansys.bdm"
namespace = true
