[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12.18,<0.13" ]

[project]
name = "ansys-bdm-shared-volume"
version = "0.5.dev0"
description = "Shared volume utilities for BDM solutions."
readme = "README.rst"
license = "Apache-2.0"
license-files = [ "LICENSE" ]
maintainers = [ { name = "ANSYS, Inc.", email = "pyansys-core@synopsys.com" } ]
authors = [ { name = "ANSYS, Inc.", email = "pyansys-core@synopsys.com" } ]
requires-python = ">=3.11,<4"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Other Audience",
  "Natural Language :: English",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "aioshutil>=1.3,<2",
  "ansys-bdm-api>=0.5,<1.0",
]

[tool.uv]
sources.ansys-bdm-shared-volume = { workspace = true }
build-backend.module-name = "ansys.bdm.shared_volume"
build-backend.namespace = true
prerelease-package = { ansys-bdm-api = "allow" }
prereleases = "if-necessary"

[tool.pytest]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--import-mode=importlib",
  "-nlogical",
  "--dist=loadfile",
]
asyncio_mode = "auto"
filterwarnings = [
  "error",
  "ignore::ResourceWarning",
]
log_cli = true
norecursedirs = [ ".moon", ".venv", "tmp*", ".git" ]
pythonpath = [ "." ]
testpaths = [ "tests/" ]

[tool.coverage]
run.source = [ "ansys.bdm.shared_volume" ]
run.omit = [
  "*/ansys/bdm/api/*",
  "read_toml.py",
  "tests/*",
]
run.disable_warnings = [ "no-data-collected" ]
report.show_missing = true
