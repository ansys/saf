$schema: "https://moonrepo.dev/schemas/project.json"

language: "python"
stack: "backend"
layer: "library"

project:
  description: "A collection of pre-assembled, high-level Dash UI components built
    on Dash Mantine Components for simulation web applications"

tasks:
  build-doc:
    description: "Build API documentation"
    deps:
      - target: "~:check-env-var"
        args:
          - "UV_PYTHON"
          - "MOON_PYTHON_VERSION"
    command: 'uv'
    args:
      - "run"
      - "sphinx-build"
      - "-M"
      - "html"
      - "$projectSource/doc/source"
      - "$projectSource/doc/_build"
      - "-j"
      - "auto"
      - "--keep-going"
      - "-v"
    env:
      DISABLE_INTERSPHINX: 'true'
    inputs:
      - "doc/**/*"
      - "pyproject.toml"
    options:
      runFromWorkspaceRoot: true
