$schema: "https://moonrepo.dev/schemas/project.json"

language: "python"
stack: "backend"
layer: "library"

project:
  description: "Solution Application Framework / Guided Low-Code Workflow (SAF GLOW) engine"

tasks:
  build-doc:
    description: "Build API documentation"
    deps:
      - target: "~:check-env-var"
        args: 
          - "UV_PYTHON"
          - "MOON_PYTHON_VERSION"
    command: 'uv'
    args:
      - "run"
      - "sphinx-build"
      - "-M"
      - "html"
      - "$projectSource/doc/source"
      - "$projectSource/doc/_build"
      - "-j"
      - "auto"
      - "--keep-going"
      - "-v"
    env:
      DISABLE_INTERSPHINX: 'true'
    inputs:
      - "doc/**/*"
      - "pyproject.toml"
      - "/uv.lock"
    options:
      runFromWorkspaceRoot: true

  test:
    args:
      - "run"
      - "--package"
      - "$projectAlias"
      - "--group"
      - "tests"
      - "--group"
      - "tests-glow-engine"
      - "pytest"
      - "--cov=."
      - "--cov-report=term"
      - "--cov-report=xml"
      - "--cov-report=html"
      - "-p"
      - "no:faulthandler"
      - "-s" # Disable capturing of stdout and stderr during tests
    options:
      mergeArgs: replace

  pyright:
    command: "uv"
    args:
      - "run"
      - "--package"
      - "$projectAlias"
      - "--group"
      - "tests-glow-engine"
      - "pyright"
      - "$projectSource"
    options:
      mergeArgs: replace
