tasks:
  test:
    args:
      - "run"
      - "--package"
      - "$projectAlias"
      - "--group"
      - "tests"
      - "--group"
      - "tests-saf-cli"
      - "pytest"
      - "--cov=."
      - "--cov-report=term"
      - "--cov-report=xml"
      - "--cov-report=html"
      - "-p"
      - "no:faulthandler"
      - "-s" # Disable capturing of stdout and stderr during tests
    options:
      mergeArgs: replace

  saf-new:
    command: "uv"
    args:
      - "run"
      - "--package"
      - "$projectAlias"
      - "saf"
      - "new"
      - "$args"
    options:
      runFromWorkspaceRoot: true

