[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12.18,<0.13" ]

[project]
name = "ansys-saf-cli"
version = "4.4.dev0"
description = "Command line interface for developing SAF solutions from scaffolding to packaging."
readme = "README.rst"
keywords = [
  "python",
  "saf",
  "solution",
  "solution application framework",
]
license = "Apache-2.0"
license-files = [ "LICENSE" ]
maintainers = [ { name = "ANSYS, Inc.", email = "pyansys-core@synopsys.com" } ]
authors = [ { name = "ANSYS, Inc.", email = "pyansys-core@synopsys.com" } ]
requires-python = ">=3.11,<4"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Other Audience",
  "Natural Language :: English",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "ansys-saf-templates>=0.2.0,<1.0.0",
  "chardet>=5.2.0,<7",                 # chardet 7.0 breaks binaryornot used by cookiecutter
  "click>=8.1.7,<9",
  "cookiecutter>=2.6.0,<3",
  "packaging>=24.2,<25",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0.0,<2",
  "tomlkit>=0.14.0,<1.0.0",
]
scripts.saf = "ansys.saf.cli._cli.main:entry_point"

[tool.uv]
sources.ansys-saf-cli = { workspace = true }
build-backend.module-name = "ansys.saf.cli"
build-backend.namespace = true
prerelease-package.ansys-saf-templates = "allow"
prerelease-package.prereleases = "if-necessary"

[tool.bandit]
exclude_dirs = [ "setup_environment.py", "tests" ]

[tool.pytest]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--import-mode=importlib",
  "-nlogical",
  "--dist=loadfile",
]
filterwarnings = []
log_cli = true
markers = [ "use_session_solution", "use_custom_plugins", "use_hps", "use_pim", "use_minerva" ]
norecursedirs = [ ".moon", ".venv", "tmp*", ".git" ]
pythonpath = [ "." ]
testpaths = [ "tests" ]

[tool.coverage]
run.source = [ "ansys.saf.cli" ]
run.omit = [
  "*/.venv/*",
  "*/pytest-of-*/pytest-*/popen-*/*",
  "*/site-packages/*",
  "*/Temp/*",
  "*/tests/*",
  "/tmp/*",
  "dist/*",
]
report.omit = [
  "*/_solutions/templates/*",
  "*/pytest-of-*/pytest-*/popen-*/*",
  "*/Temp/*",
  "*/tests/*",
  "/tmp/*",
  "dist/*",
]
report.show_missing = true
