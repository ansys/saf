name: build solution images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag to apply to the built images and to the artifact name."
        required: false
        type: string
        default: "main"
  workflow_call:
    inputs:
      image_tag:
        description: "Tag to apply to the built images and to the artifact name."
        required: false
        type: string
        default: "main"

permissions: {}

env:
  APP_NAME: "{{ cookiecutter.__docker_name }}"
  IMAGE_TAG: {{ "${{ inputs.image_tag }}" }}
  ARTIFACT_NAME: "{{ cookiecutter.__docker_name }}-images-{{ '${{ inputs.image_tag }}' }}"
  TAR_FILE: "{{ cookiecutter.__docker_name }}-images-{{ '${{ inputs.image_tag }}' }}.tar"

concurrency:
  group: {{ "${{ github.workflow }}-${{ github.ref }}-${{ inputs.image_tag }}" }}
  cancel-in-progress: true

jobs:
  build-images:
    name: Build and export solution images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deployments/Dockerfile
          target: solution_api
          tags: {{ "${{ env.APP_NAME }}-api:${{ env.IMAGE_TAG }}" }}
          load: true
          push: false
          cache-from: type=gha,scope=solution-api
          cache-to: type=gha,scope=solution-api,mode=max

{% if cookiecutter.__ui_framework != "none" %}
      - name: Build UI image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deployments/Dockerfile
          target: solution_ui
          tags: {{ "${{ env.APP_NAME }}-ui:${{ env.IMAGE_TAG }}" }}
          load: true
          push: false
          cache-from: type=gha,scope=solution-ui
          cache-to: type=gha,scope=solution-ui,mode=max
{% endif %}

      - name: Save images to a single tar file
        run: |
          docker save \
            -o "${TAR_FILE}" \
{%- if cookiecutter.__ui_framework != "none" %}
            "${APP_NAME}-api:${IMAGE_TAG}" \
            "${APP_NAME}-ui:${IMAGE_TAG}"
{%- else %}
            "${APP_NAME}-api:${IMAGE_TAG}"
{%- endif %}
          ls -lh "${TAR_FILE}"

      - name: Upload image tar as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: {{ "${{ env.ARTIFACT_NAME }}" }}
          path: {{ "${{ env.TAR_FILE }}" }}
          if-no-files-found: error
          retention-days: 30
