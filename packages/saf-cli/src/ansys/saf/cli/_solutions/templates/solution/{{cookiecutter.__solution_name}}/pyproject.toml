[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "{{cookiecutter.__pkg_name}}"
version = "{{cookiecutter.__version}}"
description = ""
license = "LicenseRef-Proprietary"
authors = [{ name = "ANSYS, Inc.", email = "solution-applications.maintainers@ansys.com" }]
maintainers = [{ name = "ANSYS, Inc.", email = "solution-applications.maintainers@ansys.com" }]
readme = "README.md"
keywords = ["Ansys Solutions"]
requires-python = ">=3.11,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Other Audience",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "ansys-saf-glow-engine[hps]>=2.1.dev0,<3.0.0",
    "ansys-saf-product-manager>=0.5.0.dev0,<1.0.0",
]

{% set namespace_parent = cookiecutter.__solution_namespace.split(".")[0] %}

[saf-cli-version]
saf-cli-version = "{{cookiecutter.__saf_cli_version}}"

[dependency-groups]
desktop = [
    "ansys-saf-desktop-orchestrator>=1.14.dev1,<2.0.0",
]

{% if cookiecutter.__ui_framework == "dash" %}
ui = [
    "ansys-solutions-dash-super-components>=0.2.dev8,<1.0.0",
    "dash>=3.0.0,<4.0.0",
    "dash-bootstrap-components>=1.2,<2.0",
    "dash-extensions>=2.0.5,<3.0.0",
    "dash-mantine-components>=2.6.0,<3.0.0",
    "waitress>=3.0.0,<4.0.0",
]
{% endif %}

doc = [
    "ansys-sphinx-theme[autoapi]>=1.7.0,<2.0.0",
    "autodoc-pydantic>=2.2.0,<3.0.0",
    "nbsphinx>=0.9.8,<1.0.0",
    "numpydoc>=1.10.0,<2.0.0",
    "sphinx>=8.1.3,<9.0.0",
    "sphinx-autodoc-typehints>=2.2.0,<3.0.0",
    "sphinx-code-tabs>=0.5.5,<1.0.0",
    "sphinx-copybutton>=0.5.2,<1.0.0",
    "sphinx-design>=0.6.1,<1.0.0",
    "sphinx-gallery>=0.20,<1.0.0",
    "sphinx-jinja>=2.0.0,<3.0.0",
    "sphinx-markdown-builder>=0.6.9,<1.0.0",
    "sphinx-tabs>=1.2.1,<3.5.0",
    "sphinx-toolbox>=4.1.0,<5.0.0",
    "sphinxcontrib-mermaid>=1.2.3,<2.0.0",
    "sphinxcontrib-video>=0.4.1,<1.0.0",
    "sphinxemoji>=0.3.1,<1.0.0",
    "toml>=0.10.2,<1.0.0",
    "vale>=3.13.0.0,<4.0.0",
]

tests = [
    "coverage>=7.0.0,<8.0.0",
    "filelock>=3.8.0,<4.0.0",
    "httpx2>=2.5.0,<3.0.0",
    "mock>=4.0.3,<5.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-dependency>=0.5.1,<1.0.0",
    "pytest-flakes>=4.0.5,<5.0.0",
    "pytest-mock>=3.12,<4.0.0",
    "pytest-pycodestyle>=2.5.0,<3.0.0",
    "pytest-pythonpath>=0.7,<1.0.0",
    "pytest-xdist>=3.0.2,<4.0.0",
    "pytest>=9.0.3,<10.0.0",
    "tox>=4.4.0,<5.0.0",
]

build = [
    "ansys-saf-desktop-installer>=1.16.0.dev0,<2.0.0",
    "build>=0.8.0,<1.0.0",
    "pkginfo>=1.12.1.2,<2.0.0",
    "pyc-wheel>=1.2.7,<2.0.0",
    "pyinstaller>=6.16,<7.0.0; python_version < '3.15'",
    "toml>=0.10.2,<1.0.0",
    "twine==6.0.1",
]

style = [
    "black>=26.3.1,<27.0.0",
    "codespell>=2.4.1,<3.0.0",
    "flake8>=7.3.0,<8.0.0",
    "isort>=7.0.0,<8.0.0",
    "pydocstyle>=6.3.0,<7.0.0",
    "tox>=4.4.0,<5.0.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["{{ namespace_parent }}*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["**/*"]

[tool.uv]
package = true
prerelease = "if-necessary"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
force_sort_within_sections = true
line_length = 120
default_section = "THIRDPARTY"
src_paths = ["doc", "src", "tests"]

[tool.codespell]
skip = '.github,.venv,.tox,requirements,CODEOWNERS,*.tmp,CHANGELOG.md'
count = ''
quiet-level = 3
check-hidden = ""
ignore-words = ".codespell.ignore"

[tool.coverage.run]
source = ["{{ cookiecutter.__solution_namespace }}"]

[tool.coverage.report]
show_missing = true

[tool.towncrier]
package = "{{ cookiecutter.__pkg_namespace }}"
directory = "doc/changelog.d"
filename = "doc/source/changelog.rst"
start_string = ".. towncrier release notes start\n"
template = "doc/changelog.d/changelog_template.jinja"
title_format = "`{version} <https://github.com/ansys/{{ cookiecutter.__solution_name }}/releases/tag/v{version}>`_ - {project_date}"
issue_format = "`#{issue} <https://github.com/ansys/{{ cookiecutter.__solution_name }}/pull/{issue}>`_"

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "dependencies"
name = "Dependencies"
showcontent = true

[[tool.towncrier.type]]
directory = "miscellaneous"
name = "Miscellaneous"
showcontent = true
