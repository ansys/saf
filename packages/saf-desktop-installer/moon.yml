tasks:
  test:
    args:
      - "run"
      - "--package"
      - "$projectAlias"
      - "--group"
      - "tests"
      - "--group"
      - "tests-desktop-installer"
      - "pytest"
      - "--cov=."
      - "--cov-report=term"
      - "--cov-report=xml"
      - "--cov-report=html"
      - "-p"
      - "no:faulthandler"
      - "-s" # Disable capturing of stdout and stderr during tests
    options:
      mergeArgs: replace

  pyright:
    command: "uv"
    args:
      - "run"
      - "--package"
      - "$projectAlias"
      - "--group"
      - "tests-desktop-installer"
      - "pyright"
      - "$projectSource"
    options:
      mergeArgs: replace
