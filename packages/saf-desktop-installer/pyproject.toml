[build-system]
build-backend = "poetry.core.masonry.api"
requires = [ "poetry-core>=2.0.0", "setuptools>=67.0" ]

[tool.poetry]
name = "ansys-saf-desktop-installer"
version = "1.17.1"
description = "SAF desktop installer"
license = "Apache-2.0"
authors = [ "ANSYS, Inc. <solution-applications.maintainers@ansys.com>" ]
maintainers = [ "ANSYS, Inc. <solution-applications.maintainers@ansys.com>" ]
readme = "README.rst"
keywords = [
  "solution application framework",
  "ansys solutions",
  "python",
  "glow",
  "saf",
  "solution",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Other Audience",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]

[[tool.poetry.packages]]
include = "ansys/saf/desktop/installer"
from = "src"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[tool.poetry.dependencies]
python = ">=3.11,<4"
click = "^8.1.7"
packaging = "^24.0"
pyinstaller = { version = "^6.16", python = "<3.15" }
requests = "^2.28.2"
toml = "^0.10.2"
python-dotenv = "^1.1.0"

[tool.poetry.group.doc]
optional = true
[tool.poetry.group.doc.dependencies]
ansys-sphinx-theme = "^1.4"
autodoc_pydantic = "^2.0"
numpydoc = "^1.6.0"
sphinx = "^8.0"
sphinx-code-tabs = "^0.5.5"
sphinx-design = "^0.6.1"
sphinx_mdinclude = "^0.6.2"
sphinx-autobuild = "^2021.3.14"
sphinx-autodoc-typehints = "^2.5.0"
sphinxcontrib-websupport = "^1.2.4"
sphinx-copybutton = "^0.5.2"
sphinxemoji = "^0.2"
sphinx-gallery = "^0.15"
sphinx-notfound-page = "^0.8.3"
sphinx-tabs = ">=1.2.1,<3.5.0"
toml = "^0.10.2"

[tool.poetry.group.tests]
optional = true
[tool.poetry.group.tests.dependencies]
ansys-saf-testing = { version = ">=0.13.0, <1.0", extras = [
  "selenium",
] }
coverage = "^7.10.6"
httpx2 = "^2.5.0"
mock = "^4.0.3"
pillow = "^12.1.1"
pylnk3 = "^0.4.2"
pytest = "^9.0.3"
pytest-cov = "^7.1.0"
pytest-html = "^4.1.0"
pytest-md = "^0.2.0"
pytest-mock = "^3.10.0"
pytest-order = "^1.1.0"
pytest-rerunfailures = "^15.0.0"
pytest-timeout = "^2.3.1"
pytest-xdist = "^3.6.1"
tenacity = "^8.5.0"
# The following packages are included to allow testing solution_desktop_deployment.py
dash_bootstrap_components = { version = "^1.2" }
dash = "^3.0.0"
pywebview = "^6.0"

[tool.poetry.group.style]
optional = true
[tool.poetry.group.style.dependencies]
# The following packages are included for the linting of the solution in tests/mocks and solution_desktop_deployment
ansys-saf-glow-engine = { version = "^2.1.0", extras = [
  "dash",
] }
dash_bootstrap_components = { version = "^1.2" }
pythonnet = { version = "^3.1.0", python = "<3.15" } # subdependency of pywebview. older versions don't support PEP 517 builds
pywebview = "^6.0"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
  "conf.py",
]

# in same order as in https://docs.astral.sh/ruff/rules
lint.select = [
  "A",      # flake8-builtins
  "ASYNC",  # flake8-async
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "C90",    # mccabe
  "COM",    # flake8-commas
  "E",      # pycodestyle - error
  "F",      # pyflakes
  "I",      # isort
  "LOG",    # flake8-logging
  "N",      # pep8-naming
  "PIE",    # flake8-pie
  "PT",     # flake8-pytest-style
  "PTH",    # flake8-use-pathlib
  "PYI",    # flake8-pyi
  "Q",      # flake8-quotes
  "RUF100", # ruff-specific rules: unused noqa
  "SIM",    # flake8-simplify
  "UP",     # pyupgrade
  "W",      # pycodestyle - warning
]
lint.ignore = [ "PTH207" ]
lint.flake8-pytest-style.mark-parentheses = false
lint.isort.force-sort-within-sections = true
lint.isort.known-first-party = [ "src", "doc", "tests" ]

[tool.pytest.ini_options]
pythonpath = "."
addopts = [
  "--strict-config",
  "--strict-markers",
  "--import-mode=importlib",
  "-nlogical",
  "--dist=loadfile",
]
markers = [  ]
filterwarnings = [  ]
testpaths = [ "tests" ]

[tool.coverage.run]
source = [ "ansys.saf.desktop.installer" ]
omit = [ "dist/*" ]

[tool.coverage.report]
show_missing = true
omit = [ "*/pytest-of-*/pytest-*/popen-*/*", "/tmp/*", "*/Temp/*", "dist/*" ]

[tool.pyright]
pythonVersion = "3.11"
extraPaths = [ "src" ]
include = [ "src/ansys/saf/desktop/installer", "tests" ]
exclude = [
  ".venv",
  ".poetry",
  ".tox",
  ".git",
  "doc/source/conf.py",
]
strict = [ "src/ansys/saf/desktop/installer", "tests" ]
venvPath = "."
venv = ".venv"

[tool.bandit]
exclude_dirs = [ "tests" ]

[build-system-requirements]
build-system-version = "2.3.2"
