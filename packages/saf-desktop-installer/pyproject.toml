[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12.18,<0.13" ]

[project]
name = "ansys-saf-desktop-installer"
version = "1.18.dev0"
description = "SAF desktop installer"
license = "Apache-2.0"
license-files = [ "LICENSE" ]
maintainers = [ { name = "ANSYS, Inc.", email = "pyansys-core@synopsys.com" } ]
authors = [ { name = "ANSYS, Inc.", email = "pyansys-core@synopsys.com" } ]
requires-python = ">=3.11,<4"
readme = "README.rst"
keywords = [
  "solution application framework",
  "ansys solutions",
  "python",
  "glow",
  "saf",
  "solution",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Other Audience",
  "Natural Language :: English",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "click>=8.1.7,<9",
  "packaging>=24.0,<25",
  "pyinstaller>=6.16,<7; python_version<'3.15'",
  "requests>=2.28.2,<3",
  "toml>=0.10.2,<0.11",
  "python-dotenv>=1.1.0,<2",
]

[tool.pytest.ini_options]
pythonpath = "."
addopts = [
  "--strict-config",
  "--strict-markers",
  "--import-mode=importlib",
  "-nlogical",
  "--dist=loadfile",
]
markers = [  ]
filterwarnings = [  ]
testpaths = [ "tests" ]

[tool.coverage.run]
source = [ "ansys.saf.desktop.installer" ]
omit = [ "dist/*" ]

[tool.coverage.report]
show_missing = true
omit = [ "*/pytest-of-*/pytest-*/popen-*/*", "/tmp/*", "*/Temp/*", "dist/*" ]

[tool.pyright]
pythonVersion = "3.12"
extraPaths = [ "src" ]
include = [ "src/ansys/saf/desktop/installer", "tests" ]
exclude = [
  ".venv",
  ".poetry",
  ".tox",
  ".git",
  "doc/source/conf.py",
]
strict = [ "src/ansys/saf/desktop/installer", "tests" ]
venvPath = "../.."
venv = ".venv"

[tool.bandit]
exclude_dirs = [ "tests" ]

[tool.uv.sources]
ansys-saf-desktop-installer = { workspace = true }

[tool.uv.build-backend]
module-name = "ansys.saf.desktop.installer"
namespace = true
