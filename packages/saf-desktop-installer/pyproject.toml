[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12.18,<0.13" ]

[project]
name = "ansys-saf-desktop-installer"
version = "1.18.dev0"
description = "SAF desktop installer"
readme = "README.rst"
keywords = [
  "ansys solutions",
  "glow",
  "python",
  "saf",
  "solution",
  "solution application framework",
]
license = "Apache-2.0"
license-files = [ "LICENSE" ]
maintainers = [ { name = "ANSYS, Inc.", email = "pyansys-core@synopsys.com" } ]
authors = [ { name = "ANSYS, Inc.", email = "pyansys-core@synopsys.com" } ]
requires-python = ">=3.11,<4"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Other Audience",
  "Natural Language :: English",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "click>=8.1.7,<9",
  "packaging>=24.0,<25",
  "pyinstaller>=6.16,<7; python_version<'3.15'",
  "python-dotenv>=1.1.0,<2",
  "requests>=2.28.2,<3",
  "toml>=0.10.2,<0.11",
]

[tool.uv]
sources.ansys-saf-desktop-installer = { workspace = true }
build-backend.module-name = "ansys.saf.desktop.installer"
build-backend.namespace = true

[tool.pytest]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--import-mode=importlib",
  "-nlogical",
  "--dist=loadfile",
  "--ignore=.moon",
  "--ignore=.venv",
  "--ignore=tmp*",
  "--ignore=.git",
]
asyncio_mode = "auto"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
log_cli = true
markers = []
norecursedirs = [ ".moon", ".venv", "tmp*", ".git" ]
pythonpath = [ "." ]
testpaths = [ "tests/" ]

[tool.coverage]
run.source = [ "ansys.saf.desktop.installer" ]
run.omit = [
  "*/.venv/*",
  "*/pytest-of-*/pytest-*/popen-*/*",
  "*/site-packages/*",
  "*/Temp/*",
  "*/tests/*",
  "/tmp/*",
  "dist/*",
]
report.omit = [
  "*/pytest-of-*/pytest-*/popen-*/*",
  "*/Temp/*",
  "/tmp/*",
  "dist/*",
]
report.show_missing = true
