[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synopsys-custom-ns-solution"
version = "0.1.dev0"
description = ""
license = "LicenseRef-Proprietary"
authors = [{ name = "ANSYS, Inc.", email = "solution-applications.maintainers@ansys.com" }]
maintainers = [{ name = "ANSYS, Inc.", email = "solution-applications.maintainers@ansys.com" }]
readme = "README.md"
keywords = ["Synopsys Solutions"]
requires-python = ">=3.11,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Other Audience",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "ansys-saf-glow-engine>=2.2.0,<3.0.0",
]

[dependency-groups]
desktop = [
    "ansys-saf-desktop-orchestrator[all]>=1.14,<2.0",
]
ui = [
    "dash>=3.0.0,<4.0.0",
    "dash-bootstrap-components>=1.2,<2.0", # required by solution_desktop_deployment
    "dash-extensions>=2.0.0,<3.0.0",       # required by solution_desktop_deployment
]
build = [
    "ansys-saf-desktop-installer[all]>=1.16,<2.0",
]
doc = [
    "sphinx>=6.2.1,<7.0.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["synopsys*"]
namespaces = true

[tool.setuptools.package-data]
"synopsys.custom_ns_solution" = ["html-doc/**/*", "solution/**/*.encrypted"]

[tool.uv]
package = true
prerelease = "if-necessary"
