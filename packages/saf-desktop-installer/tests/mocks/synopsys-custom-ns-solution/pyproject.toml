[build-system]
build-backend = "poetry.core.masonry.api"
requires = [ "poetry-core>=2.0.0", "setuptools>=67.0" ]

[tool.poetry]
name = "synopsys-custom-ns-solution"
version = "0.1.dev0"
description = ""
license = "Proprietary"
authors = [ "ANSYS, Inc. <solution-applications.maintainers@ansys.com>" ]
maintainers = [ "ANSYS, Inc. <solution-applications.maintainers@ansys.com>" ]
readme = "README.md"
keywords = [ "Synopsys Solutions" ]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Other Audience",
  "License :: Other/Proprietary License",
  "Natural Language :: English",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
packages = [
  { include = "synopsys", from = "src" },
]

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
ansys-saf-glow-engine = { version = "^2.2.0", allow-prereleases = true }

[tool.poetry.group.desktop]
optional = true
[tool.poetry.group.desktop.dependencies]
ansys-saf-desktop-orchestrator = { version = "^1.14", allow-prereleases = true, extras = [ "all" ] }

[tool.poetry.group.ui]
optional = true
[tool.poetry.group.ui.dependencies]
dash = "^3.0.0"
dash_bootstrap_components = { version = "^1.2" } # required by solution_desktop_deployment
dash-extensions = "^2.0.0"                       # required by solution_desktop_deployment

[tool.poetry.group.build]
optional = true
[tool.poetry.group.build.dependencies]
ansys-saf-desktop-installer = { version = "^1.16", allow-prereleases = true, extras = [ "all" ] }

[tool.poetry.group.doc]
optional = true
[tool.poetry.group.doc.dependencies]
sphinx = "^6.2.1"

[build-system-requirements]
build-system-version = "2.3.2"
