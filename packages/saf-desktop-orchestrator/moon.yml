$schema: "https://moonrepo.dev/schemas/project.json"

language: "python"
stack: "backend"
layer: "library"

project:
  description: "Solution Application Framework (SAF) Desktop Orchestrator"

tasks:
  test:
    args:
      - "run"
      - "--package"
      - "$projectAlias"
      - "--group"
      - "tests"
      - "--group"
      - "tests-saf-desktop-orchestrator"
      - "pytest"
      - "--cov=."
      - "--cov-report=term"
      - "--cov-report=xml"
      - "--cov-report=html"
      - "--html=report/report.html"
      - "--md=report/report.md"
      - "-p"
      - "no:faulthandler"
      - "-s" # Disable capturing of stdout and stderr during tests
    options:
      mergeArgs: replace

  pyright:
    command: "uv"
    args:
      - "run"
      - "--package"
      - "$projectAlias"
      - "--group"
      - "tests-saf-desktop-orchestrator"
      - "pyright"
      - "$projectSource"
    options:
      mergeArgs: replace
