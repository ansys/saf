[build-system]
build-backend = "poetry.core.masonry.api"
requires = [ "poetry-core>=2.0.0", "setuptools>=67.0" ]

[tool.poetry]
name = "ansys-saf-desktop-orchestrator"
version = "1.14.1"
description = "Solution Application Framework (SAF) Desktop Orchestrator"
license = "Apache-2.0"
authors = [ "ANSYS, Inc. <pyansys-core@synopsys.com>" ]
maintainers = [ "ANSYS, Inc. <pyansys-core@synopsys.com>" ]
readme = "README.rst"
keywords = [
  "solution application framework",
  "ansys solutions",
  "python",
  "glow",
  "saf",
  "solution",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Other Audience",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]

[[tool.poetry.packages]]
include = "ansys/saf/desktop/orchestrator"
from = "src"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[tool.poetry.dependencies]
python = ">=3.11,<4"
ansys-saf-glow-engine = { version = "^2.1.0", extras = [
  "pim",
] }
ansys-saf-product-configuration = { version = ">=0.21.0, <1.0" }
grpcio = "^1.47.0"
grpcio-health-checking = "^1.24.0"
httpx2 = "^2.5.0"
psutil = "^7.0"
pydantic = "^2.7"
pydantic-settings = "^2.0.2, !=2.6.0" # In 2.6.0, they changed how Settings.model_validate() works, breaking everything: https://github.com/pydantic/pydantic-settings/issues/445. It was fixed in 2.6.1.
python-dotenv = "^1.0.0"
pythonnet = { version = "^3.1.0", python = "<3.15" }
pywebview = "^6.2.1"
pyyaml = "^6.0"
typing-extensions = "^4.12.2"

[tool.poetry.group.dev]
optional = true
[tool.poetry.group.dev.dependencies]
# TODO: use a tool that makes sure the version here and in the pre-commit file are in sync!
pyright = "1.1.407"
ruff = "0.15.0"
pre-commit = "^4.5"

[tool.poetry.group.doc]
optional = true
[tool.poetry.group.doc.dependencies]
ansys-sphinx-theme = "^1.7.2"
autodoc_pydantic = "^2.0"
numpydoc = "^1.6.0"
sphinx = "^8.1.3"
sphinx-code-tabs = "^0.5.5"
sphinx-design = "^0.6.1"
sphinx_mdinclude = "^0.6.2"
sphinx-autobuild = "^2021.3.14"
sphinx-autodoc-typehints = "^2.5.0"
sphinxcontrib-websupport = "^1.2.4"
sphinx-copybutton = "^0.5.2"
sphinxemoji = "^0.2"
sphinx-gallery = "^0.15"
sphinx-notfound-page = "^0.8.3"
sphinx-tabs = ">=1.2.1,<3.5.0"
toml = "^0.10.2"

[tool.poetry.group.tests]
optional = true
[tool.poetry.group.tests.dependencies]
ansys-saf-testing = { version = ">=0.12.0, <1.0", extras = [
  "selenium",
] }
coverage = "^6.4.1"
dash = ">=3.4.0"
dash-extensions = { version = "^2.0.5", optional = true }
fastapi = ">=0.120.2,<1.0"
mock = "^4.0.3"
pandas = "^3.0.0"
pytest = "^9.0.3"
pytest-cov = "^4.0.0"
pytest-html = "^4.1.0"
pytest-md = "^0.2.0"
pytest-mock = "^3.10.0"
pytest-order = "^1.1.0"
pytest-rerunfailures = "^15.0.0"
pytest-timeout = "^2.3.1"
pytest-xdist = "^3.6.1"
streamlit = "^1.58.0" # For Streamlit-based UI server.
streamlit-antd-components = "^0.3.2" # typical in Streamlit-based apps
tenacity = "^8.0.0"

[tool.poetry.scripts]
solution-app-starter = "ansys.saf.desktop.orchestrator._scripts.solution_app_starter:run_solution"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
  "*_pb2.py",
  "*_pb2_grpc.py",
  "conf.py",
]

# in same order as in https://docs.astral.sh/ruff/rules
lint.select = [
  "A",      # flake8-builtins
  "ASYNC",  # flake8-async
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "C90",    # mccabe
  "COM",    # flake8-commas
  "E",      # pycodestyle - error
  "F",      # pyflakes
  "I",      # isort
  "LOG",    # flake8-logging
  "N",      # pep8-naming
  "PIE",    # flake8-pie
  "PT",     # flake8-pytest-style
  "PTH",    # flake8-use-pathlib
  "PYI",    # flake8-pyi
  "Q",      # flake8-quotes
  "RUF100", # ruff-specific rules: unused noqa
  "SIM",    # flake8-simplify
  "UP",     # pyupgrade
  "W",      # pycodestyle - warning
]
lint.ignore = [ "PTH207" ]
lint.flake8-pytest-style.mark-parentheses = false
lint.isort.force-sort-within-sections = true
lint.isort.known-first-party = [ "src", "doc", "tests" ]

[tool.pytest.ini_options]
pythonpath = "."
addopts = [
  "--strict-config",
  "--strict-markers",
  "--import-mode=importlib",
  "-nlogical",
  "--dist=loadfile",
]
markers = [  ]
filterwarnings = [
  "ignore::DeprecationWarning:pkg_resources.*:",
  "ignore:pkg_resources is deprecated as an API:DeprecationWarning",
]
testpaths = [ "tests" ]

[tool.coverage.run]
source = [ "ansys.saf.desktop.orchestrator" ]

[tool.coverage.report]
show_missing = true
omit = [ "*/pytest-of-*/pytest-*/popen-*/*", "/tmp/*" ]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = [ "src" ]
include = [ "src/ansys/saf/desktop/orchestrator", "tests" ]
exclude = [
  "**/*_pb2.py",
  "**/*_pb2_grpc.py",
  ".venv",
  ".poetry",
  ".tox",
  ".git",
  "doc/source/conf.py",
]
strict = [ "src/ansys/saf/desktop/orchestrator", "tests" ]
pythonVersion = "3.11"

[build-system-requirements]
build-system-version = "2.3.2"

[tool.copyright]
exclude = [
  "doc/*",
  "tests/*",
  ".github/*",
]

[tool.bandit]
exclude_dirs = [ "tests" ]
