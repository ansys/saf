[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12.18,<0.13" ]

[project]
name = "ansys-saf-desktop-orchestrator"
version = "1.15.dev0"
description = "Solution Application Framework (SAF) Desktop Orchestrator"
readme = "README.rst"
keywords = [
  "ansys solutions",
  "glow",
  "python",
  "saf",
  "solution",
  "solution application framework",
]
license = "Apache-2.0"
license-files = [ "LICENSE" ]
maintainers = [ { name = "ANSYS, Inc.", email = "pyansys-core@synopsys.com" } ]
authors = [ { name = "ANSYS, Inc.", email = "pyansys-core@synopsys.com" } ]
requires-python = ">=3.11,<4"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Other Audience",
  "Natural Language :: English",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "ansys-saf-glow-engine[pim]>=2.1.0,<3.0",
  "ansys-saf-product-configuration>=0.21.0,<1.0",
  "grpcio>=1.47.0,<2.0",
  "grpcio-health-checking>=1.24.0,<2.0",
  "httpx2>=2.5.0,<3.0",
  "psutil>=7.0,<8.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.0.2,<3.0,!=2.6.0",         # In 2.6.0, they changed how Settings.model_validate() works, breaking everything: https://github.com/pydantic/pydantic-settings/issues/445. It was fixed in 2.6.1.
  "python-dotenv>=1.0.0,<2.0",
  "pythonnet>=3.1.0,<3.15; python_version<'3.15'",
  "pywebview>=6.2.1,<7.0",
  "pyyaml>=6.0,<7.0",
  "typing-extensions>=4.12.2,<5.0",
]

scripts.solution-app-starter = "ansys.saf.desktop.orchestrator._scripts.solution_app_starter:run_solution"

[tool.pytest]
log_cli = true
norecursedirs = [ ".moon", ".venv", "tmp*", ".git" ]
pythonpath = [ "." ]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--import-mode=importlib",
  "-nlogical",
  "--dist=loadfile",
]
markers = [  ]
filterwarnings = [
  "ignore::DeprecationWarning:pkg_resources.*:",
  "ignore:pkg_resources is deprecated as an API:DeprecationWarning",
]
testpaths = [ "tests" ]

[tool.coverage.run]
source = [ "ansys.saf.desktop.orchestrator" ]

[tool.coverage.report]
show_missing = true
omit = [ "*/pytest-of-*/pytest-*/popen-*/*", "/tmp/*" ]

[tool.uv.sources]
ansys-saf-desktop-orchestrator = { workspace = true }

[tool.uv.build-backend]
module-name = "ansys.saf.desktop.orchestrator"
namespace = true
