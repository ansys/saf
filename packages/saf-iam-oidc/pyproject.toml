[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12.18,<0.13" ]

[project]
name = "ansys-iam-oidc"
version = "0.10.dev0"
description = "An OpenID Connect (OIDC) implementation for Identity and Access Management (IAM) solutions."
readme = "README.rst"
keywords = [
  "ansys solutions",
  "iam",
  "oauth2",
  "oidc",
  "python",
  "saf",
  "solution",
  "solution application framework",
]
license = "Apache-2.0"
license-files = [ "LICENSE" ]
maintainers = [ { name = "ANSYS, Inc.", email = "pyansys-core@synopsys.com" } ]
authors = [ { name = "ANSYS, Inc.", email = "pyansys-core@synopsys.com" } ]
requires-python = ">=3.11,<4"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "fastapi>=0.115.2,<1.0",
  "httpx2>=2.5.0,<3",
  "joserfc>=1.6.3,<2",
]

[tool.uv]
sources.ansys-iam-oidc = { workspace = true }
build-backend.module-name = "ansys.iam.oidc"
build-backend.namespace = true

[tool.pyright]
pythonVersion = "3.12"
venv = ".venv"
venvPath = "../.."
strict = [ "src/ansys/iam/oidc", "tests" ]
include = [ "src/ansys/iam/oidc", "tests" ]
exclude = [
  ".git",
  ".poetry",
  ".venv",
  "doc",
]
extraPaths = [ "src" ]

[tool.pytest]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--import-mode=importlib",
  "-nlogical",
  "--dist=loadfile",
]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
filterwarnings = []
log_cli = true
markers = []
norecursedirs = [ ".moon", ".venv", "tmp*", ".git" ]
pythonpath = [ "." ]
testpaths = [ "tests" ]

[tool.coverage]
run.source = [ "ansys.iam.oidc" ]
report.omit = [ "*/pytest-of-*/pytest-*/popen-*/*", "/tmp/*" ]
report.show_missing = true

[tool.copyright]
exclude = [
  "doc/*",
  "tests/*",
  ".github/*",
]
