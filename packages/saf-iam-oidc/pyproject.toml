[build-system]
build-backend = "poetry.core.masonry.api"
requires = [ "poetry-core>=2.0.0", "setuptools>=67.0" ]

[tool.poetry]
name = "ansys-iam-oidc"
version = "0.10.dev0"
description = "An OpenID Connect (OIDC) implementation for Identity and Access Management (IAM) solutions."
license = "Apache-2.0"
authors = [ "ANSYS, Inc. <pyansys-core@synopsys.com>" ]
maintainers = [ "ANSYS, Inc. <pyansys-core@synopsys.com>" ]
readme = "README.rst"
keywords = [
  "solution application framework",
  "ansys solutions",
  "python",
  "oauth2",
  "oidc",
  "iam",
  "saf",
  "solution",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]
packages = [ { include = "ansys/iam/oidc", from = "src" } ]

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[tool.poetry.dependencies]
python = ">=3.11,<4"
joserfc = "^1.6.3"
httpx2 = "^2.5.0"
fastapi = ">=0.115.2, <1.0"

[tool.poetry.group.doc]
optional = true
[tool.poetry.group.doc.dependencies]
ansys-sphinx-theme = { version = "^1.7.0", python = ">=3.12", extras = [ "autoapi" ] }
autodoc-pydantic = { version = "^2.2.0", python = ">=3.12" }
numpydoc = { version = "^1.10.0", python = ">=3.12" }
sphinx = { version = "^9.1.0", python = ">=3.12" }
sphinx-autodoc-typehints = { version = "^3.6.3", python = ">=3.12" }
sphinx-copybutton = { version = "^0.5.2", python = ">=3.12" }
sphinx-design = { version = "^0.7.0", python = ">=3.12" }
sphinx-jinja = { version = "^2.0.0", python = ">=3.12" }
toml = "^0.10.2"
tox = { version = "^4.38.1", python = ">=3.12" }

[tool.poetry.group.tests]
optional = true
[tool.poetry.group.tests.dependencies]
authlib = "^1.8.0"
coverage = "^7.0.0"
mock = "^4.0.3"
pytest = "^9.0.3"
pytest-cov = "^7.0.0"
pytest-html = "^4.1.0"
pytest-md = "^0.2.0"
pytest-mock = "^3.10.0"
pytest-order = "^1.1.0"
pytest-timeout = "^2.3.1"
pytest-xdist = "^3.6.1"
httpx2-pytest = "^1.0.0"
pytest-asyncio = "^1.3.0"


[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
  "conf.py",
]
# start with ALL and ignore as needed, limiting ignored scope as much as possible.
lint.select = [ "ALL" ]
lint.ignore = [
  "UP009", # Allow use of unsafe yaml.load in conf.py for Sphinx compatibility
]
lint.per-file-ignores."!src/**.py" = [ "D", "INP001" ]
lint.per-file-ignores.".github/*" = [
  "D", # docstrings not needed in github scripts
]
lint.per-file-ignores."tests/*" = [
  "D",       # docstrings not needed in tests
  "FBT001",  # boolean positional args allowed in tests
  "PLR2004", # magic values allowed in tests
  "S101",    # asserts allowed in tests
]
lint.flake8-pytest-style.mark-parentheses = false
lint.isort.force-sort-within-sections = true
lint.isort.known-first-party = [ "src", "doc", "tests" ]

[tool.codespell]
ignore-words = "./doc/styles/config/vocabularies/ANSYS/accept.txt"
skip = "*.log,*.json,.git,.venv,.poetry,*.lcov,htmlcov,dist,./doc/build,poetry.lock"

[tool.pytest.ini_options]
pythonpath = "."
addopts = [
  "--strict-config",
  "--strict-markers",
  "--import-mode=importlib",
  "-nlogical",
  "--dist=loadfile",
]
markers = [  ]
filterwarnings = [  ]
testpaths = [ "tests" ]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = [ "ansys.iam.oidc" ]

[tool.coverage.report]
omit = [ "*/pytest-of-*/pytest-*/popen-*/*", "/tmp/*" ]
show_missing = true

[tool.pyright]
pythonVersion = "3.11"
extraPaths = [ "src" ]
include = [ "src/ansys/iam/oidc", "tests" ]
exclude = [
  ".venv",
  ".poetry",
  ".git",
  "doc",
]
strict = [ "src/ansys/iam/oidc", "tests" ]
venvPath = "."
venv = ".venv"

[tool.copyright]
exclude = [
  "doc/*",
  "tests/*",
  ".github/*",
]

[build-system-requirements]
build-system-version = "2.3.2"
