[build-system]
build-backend = "poetry.core.masonry.api"
requires = [ "poetry-core>=2.0.0", "setuptools>=67.0" ]

[tool.poetry]
name = "ansys-saf-product-configuration"
version = "0.27.dev0"
description = "A Python package for providing configuration information about Ansys products to SAF solutions."
license = "Apache-2.0"
authors = [ "ANSYS, Inc. <pyansys-core@synopsys.com>" ]
maintainers = [ "ANSYS, Inc. <pyansys-core@synopsys.com>" ]
readme = "README.rst"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Other Audience",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]

[[tool.poetry.packages]]
include = "ansys/saf/product_configuration/"
from = "src"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[tool.poetry.urls]
Homepage = "https://github.com/ansys/saf-product-configuration"
Documentation = "https://saf-product-configuration.docs.solutions.ansys.com/"
Repository = "https://github.com/ansys/saf-product-configuration"
Issues = "https://github.com/ansys/saf-product-configuration/issues"

[tool.poetry.dependencies]
python = ">=3.11, <4"
typing-extensions = "^4.10.0"
click = { version = "^8.1.7", optional = true }
fastapi = { version = ">=0.115.2,<1.0", optional = true }
psutil = { version = "^7.0.0", optional = true }
uvicorn = { version = ">=0.24, <1.0", optional = true }
pydantic = { version = "^2.5", optional = true }
ansys-optislang-core = { version = "^1.4", optional = true }
aiohttp = { version = "^3.14.3", optional = true }           # nested dep of pyaedt/pyedb 0.61.0 (aiohttp >= 3.8). version 4.0.0a1 makes the wheel not pip-installable
pyaedt = { version = "^1.2.0", optional = true }
# Mimic the 'all' extras of pyaedt to avoid to introduce fpdf2
matplotlib = { version = ">=3.5.0", optional = true }
openpyxl = { version = " >=3.1.0", optional = true }
osmnx = { version = ">=2.0.0", optional = true }
pandas = { version = ">=1.1.0", optional = true }
pyvista = { version = ">=0.38.0,<0.49", optional = true, extras = [ "io" ] }
fast-simplification = { version = ">=0.1.7", optional = true }
ansys-tools-visualization-interface = { version = "*", optional = true }
tables = [
  { version = "<3.11", optional = true, python = ">=3.11,<3.13" },
  { version = ">=3.11.1", optional = true, python = ">=3.13" },
]
rpds-py = [
  { version = ">=0.18.1,<2026", optional = true, python = ">=3.11,<3.13" },
  { version = ">=2026.5.1", optional = true, python = ">=3.13" },
]
contourpy = [
  { version = "<=1.3.2", optional = true, python = ">=3.11,<3.12" },
  { version = ">=1.3.3", optional = true, python = ">=3.12" },
]

scikit-rf = { version = ">=0.30.0", optional = true }
scipy = [
  { version = "<=1.15.3", optional = true, python = "<3.11" },
  { version = ">=1.17.1", optional = true, python = ">=3.11" },
]
requests = { version = "*", optional = true }
typer = { version = ">=0.20.0", optional = true }
vtk = { version = ">=9.0, <9.7", optional = true }
rpyc = { version = ">=6.0.0", optional = true }
jupyterlab = { version = ">=4.6.2", optional = true }
ipython = { version = ">=7.30.0", optional = true }

[tool.poetry.extras]
fluent = [ "click", "fastapi", "psutil", "uvicorn" ]
aedt = [
  "click",
  "fastapi",
  "pyaedt",
  "pydantic",
  "uvicorn",
  "aiohttp",
  "matplotlib",
  "openpyxl",
  "osmnx",
  "pandas",
  "pyvista",
  "fast-simplification",
  "ansys-tools-visualization-interface",
  "tables",
  "rpds-py",
  "contourpy",
  "scikit-rf",
  "scipy",
  "vtk",
  "requests",
  "typer",
  "rpyc",
  "jupyterlab",
  "ipython",
]
optislang = [ "click", "fastapi", "ansys-optislang-core", "uvicorn" ]
# didn't find a way to dynamically include previous groups, so we need to copy all dependencies
all = [
  "click",
  "fastapi",
  "psutil",
  "aiohttp",
  "ansys-optislang-core",
  "pydantic",
  "uvicorn",
  "pyaedt",
  "matplotlib",
  "openpyxl",
  "osmnx",
  "pandas",
  "fast-simplification",
  "ansys-tools-visualization-interface",
  "tables",
  "rpds-py",
  "contourpy",
  "scikit-rf",
  "scipy",
  "vtk",
  "requests",
  "typer",
  "rpyc",
  "jupyterlab",
  "ipython",
]

[tool.poetry.group.doc]
optional = true
[tool.poetry.group.doc.dependencies]
ansys-sphinx-theme = { extras = [ "autoapi" ], version = "^1.7.0", python = ">=3.12" }
autodoc-pydantic = { version = "^2.2.0", python = ">=3.12" }
numpydoc = { version = "^1.10.0", python = ">=3.12" }
sphinx = { version = "^9.1.0", python = ">=3.12" }
sphinx-autodoc-typehints = { version = "^3.6.3", python = ">=3.12" }
sphinx-copybutton = { version = "^0.5.2", python = ">=3.12" }
sphinx-design = { version = "^0.7.0", python = ">=3.12" }

[tool.poetry.group.dev]
optional = true
[tool.poetry.group.dev.dependencies]
# TODO: use a tool that makes sure the version here and in the pre-commit file are in sync!
pyright = "1.1.407"
ruff = "0.15.0"
pre-commit = "^4.5"

[tool.poetry.group.tests]
optional = true
[tool.poetry.group.tests.dependencies]
coverage = "^7.13.5"
mock = "^4.0.3"
pytest = "^9.0.3"
pytest-cov = "^7.1.0"
pytest-html = "^4.1.0"
pytest-md = "^0.2.0"
pytest-mock = "^3.10.0"

[tool.ruff]
target-version = "py311"
line-length = 120

lint.select = [ "A", "B", "C90", "E", "F", "I", "N", "PT", "PTH", "RUF100" ]
lint.flake8-pytest-style.mark-parentheses = false
lint.isort.force-sort-within-sections = true
lint.isort.known-first-party = [ "src", "doc", "tests" ]

[tool.pytest.ini_options]
pythonpath = "."
addopts = [
  "--strict-config",
  "--strict-markers",
  "--import-mode=importlib",
]
testpaths = [ "tests" ]
filterwarnings = [
  "error",
  "ignore:The `__fields__` attribute is deprecated, use `model_fields` instead.*:pydantic.warnings.PydanticDeprecatedSince20",
  "ignore:'asyncio.iscoroutinefunction' is deprecated and slated for removal in Python 3.16:DeprecationWarning",
  "ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead.",
  "ignore:defusedxml.cElementTree is deprecated:DeprecationWarning",
  "ignore:the imp module is deprecated in favour of importlib and slated for removal in Python 3.12; see the module's documentation for alternative uses:DeprecationWarning",
]

[tool.coverage.run]
source = [ "ansys.saf.product_configuration" ]

[tool.coverage.report]
show_missing = true
include = [ "src/*" ]
omit = [ "*/pytest-of-*/pytest-*/popen-*/*" ]

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
extraPaths = [ "src" ]
include = [ "src", "tests", "doc" ]
exclude = [
  ".venv",
  ".poetry",
  ".git",
  "doc/source",
]
strict = [ "src", "tests", "doc" ]

[build-system-requirements]
build-system-version = "2.3.2"

[tool.bandit]
exclude_dirs = [ "tests" ]
