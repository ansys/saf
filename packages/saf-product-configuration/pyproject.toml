[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12.18,<0.13" ]

[project]
name = "ansys-saf-product-configuration"
version = "0.27.dev0"
description = "A Python package for providing configuration information about Ansys products to SAF solutions."
readme = "README.rst"
license = "Apache-2.0"
license-files = [ "LICENSE" ]
maintainers = [ { name = "ANSYS, Inc.", email = "pyansys-core@synopsys.com" } ]
authors = [ { name = "ANSYS, Inc.", email = "pyansys-core@synopsys.com" } ]
requires-python = ">=3.11,<4"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Other Audience",
  "Natural Language :: English",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "typing-extensions>=4.10.0,<5.0.0",
]

optional-dependencies.aedt = [
  "aiohttp>=3.14.3,<4.0.0",
  "ansys-tools-visualization-interface",
  "click>=8.1.7,<9.0.0",
  "contourpy<=1.3.2; python_version>='3.11' and python_version<'3.12'",
  "contourpy>=1.3.3; python_version>='3.12'",
  "fast-simplification>=0.1.7",
  "fastapi>=0.115.2,<1.0",
  "ipython>=7.30.0",
  "jupyterlab>=4.6.2",
  "matplotlib>=3.5.0",
  "openpyxl>=3.1.0",
  "osmnx>=2.0.0",
  "pandas>=1.1.0",
  "pyaedt>=1.2.0,<2.0",
  "pydantic>=2.5,<3.0",
  "pyvista[io]>=0.38.0,<0.49",                                               # Included the [io] extra specified earlier
  "requests",
  "rpds-py>=0.18.1,<2026; python_version>='3.11' and python_version<'3.13'",
  "rpds-py>=2026.5.1; python_version>='3.13'",
  "rpyc>=6.0.0",
  "scikit-rf>=0.30.0",
  "scipy<=1.15.3; python_version<'3.11'",
  "scipy>=1.17.1; python_version>='3.11'",
  "tables<3.11; python_version>='3.11' and python_version<'3.13'",
  "tables>=3.11.1; python_version>='3.13'",
  "typer>=0.20.0",
  "uvicorn>=0.24,<1.0",
  "vtk>=9.0,<9.7",
]
optional-dependencies.all = [
  "aiohttp>=3.14.3,<4.0.0",
  "ansys-optislang-core>=1.4,<2.0",
  "ansys-tools-visualization-interface",
  "click>=8.1.7,<9.0.0",
  "contourpy<=1.3.2; python_version>='3.11' and python_version<'3.12'",
  "contourpy>=1.3.3; python_version>='3.12'",
  "fast-simplification>=0.1.7",
  "fastapi>=0.115.2,<1.0",
  "ipython>=7.30.0",
  "jupyterlab>=4.6.2",
  "matplotlib>=3.5.0",
  "openpyxl>=3.1.0",
  "osmnx>=2.0.0",
  "pandas>=1.1.0",
  "psutil>=7.0.0,<8.0.0",
  "pyaedt>=1.2.0,<2.0",
  "pydantic>=2.5,<3.0",
  "pyvista[io]>=0.38.0,<0.49",
  "requests",
  "rpds-py>=0.18.1,<2026; python_version>='3.11' and python_version<'3.13'",
  "rpds-py>=2026.5.1; python_version>='3.13'",
  "rpyc>=6.0.0",
  "scikit-rf>=0.30.0",
  "scipy<=1.15.3; python_version<'3.11'",
  "scipy>=1.17.1; python_version>='3.11'",
  "tables<3.11; python_version>='3.11' and python_version<'3.13'",
  "tables>=3.11.1; python_version>='3.13'",
  "typer>=0.20.0",
  "uvicorn>=0.24,<1.0",
  "vtk>=9.0,<9.7",
]
optional-dependencies.fluent = [
  "click>=8.1.7,<9.0.0",
  "fastapi>=0.115.2,<1.0",
  "psutil>=7.0.0,<8.0.0",
  "uvicorn>=0.24,<1.0",
]
optional-dependencies.optislang = [
  "ansys-optislang-core>=1.4,<2.0",
  "click>=8.1.7,<9.0.0",
  "fastapi>=0.115.2,<1.0",
  "uvicorn>=0.24,<1.0",
]

[tool.pytest.ini_options]
pythonpath = "."
addopts = [
  "--strict-config",
  "--strict-markers",
  "--import-mode=importlib",
]
testpaths = [ "tests" ]
filterwarnings = [
  "error",
  "ignore:The `__fields__` attribute is deprecated, use `model_fields` instead.*:pydantic.warnings.PydanticDeprecatedSince20",
  "ignore:'asyncio.iscoroutinefunction' is deprecated and slated for removal in Python 3.16:DeprecationWarning",
  "ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead.",
  "ignore:defusedxml.cElementTree is deprecated:DeprecationWarning",
  "ignore:the imp module is deprecated in favour of importlib and slated for removal in Python 3.12; see the module's documentation for alternative uses:DeprecationWarning",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated, use anyio.from_thread.BlockingPortal instead.:DeprecationWarning",
]

[tool.coverage.run]
source = [ "ansys.saf.product_configuration" ]

[tool.coverage.report]
show_missing = true
include = [ "src/*" ]
omit = [ "*/pytest-of-*/pytest-*/popen-*/*" ]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "../.."
venv = ".venv"
extraPaths = [ "src" ]
include = [ "src", "tests", "doc" ]
exclude = [
  ".venv",
  ".poetry",
  ".git",
  "doc/source",
]
strict = [ "src", "tests", "doc" ]

[tool.uv.sources]
ansys-saf-product-configuration = { workspace = true }

[tool.uv.build-backend]
module-name = "ansys.saf.product_configuration"
namespace = true
