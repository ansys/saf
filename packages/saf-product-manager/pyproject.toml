[build-system]
build-backend = "poetry.core.masonry.api"
requires = [ "poetry-core>=2.0.0", "setuptools>=67.0" ]

[tool.poetry]
name = "ansys-saf-product-manager"
version = "0.6.dev0"
description = "SAF Product Manager"
license = "Apache-2.0"
authors = [ "ANSYS, Inc. <pyansys-core@synopsys.com>" ]
maintainers = [ "ANSYS, Inc. <pyansys-core@synopsys.com>" ]
readme = "README.rst"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Other Audience",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]

[[tool.poetry.packages]]
include = "ansys/saf/product_manager/"
from = "src"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
ansys-bdm-api = { version = ">=0.5.0, <1.0", allow-prereleases = true }
ansys-bdm-shared-volume = { version = ">=0.4.0, <1.0", allow-prereleases = true }
ansys-saf-glow-engine = { version = "^2.3.dev0", allow-prereleases = true }
ansys-saf-product-configuration = { version = ">=0.25.0, <1.0", allow-prereleases = true }      # not explicitly imported, but managers depend on the specific implementations of the config/wrappers.
httpx2 = { version = "^2.5.0", optional = true }                                                # for using AEDT, Fluent, Optislang Wrapper or Visor
ansys-visor-viewer = { version = "^1.0.1", optional = true }
ansys-fluent-core = { version = ">=0.39, <1.0", python = ">=3.11,<3.15", optional = true }      # for using Fluent instance manager
pyansys-tools-report = { version = "*", optional = true }                                       # used by the fluent instance manager
ansys-geometry-core = { version = ">=0.14.1, <1.0", optional = true }                           # for using Geometry instance manager.
ansys-mapdl-core = { version = ">=0.73.0, <1.0", python = ">=3.11, <3.15", optional = true }    # for using Mapdl instance manager
ansys-mechanical-core = { version = ">=0.12, <1.0", python = ">=3.11, <3.15", optional = true } # for using Mechanical instance manager
ansys-optislang-core = { version = "^1.4.0", optional = true }                                  # for using Optislang instance manager
pyaedt = { version = "^1.0.0", optional = true }
aiohttp = { version = "^3.14.2", optional = true }                                              # nested dep introduced by pyaedt/pyedb 0.61.0 (aiohttp >= 3.8). version 4.0.0a1 makes the wheel not pip-installable
# Mimic the 'all' extras of pyaedt to avoid to introduce fpdf2
matplotlib = { version = ">=3.5.0", optional = true }
openpyxl = { version = " >=3.1.0", optional = true }
osmnx = { version = ">=2.0.0", optional = true }
pandas = { version = ">=1.1.0", optional = true }
pyvista = { version = ">=0.38.0,<0.49", optional = true, extras = [ "io" ] }
fast-simplification = { version = ">=0.1.7", optional = true }
ansys-tools-visualization-interface = { version = "*", optional = true }
tables = [
  { version = "<3.11", optional = true, python = ">=3.11,<3.13" },
  { version = ">=3.11.1", optional = true, python = ">=3.13" },
]
rpds-py = [
  { version = ">=0.18.1,<2026", optional = true, python = ">=3.11,<3.13" },
  { version = ">=2026.5.1", optional = true, python = ">=3.13" },
]
contourpy = [
  { version = "<=1.3.2", optional = true, python = ">=3.11,<3.12" },
  { version = ">=1.3.3", optional = true, python = ">=3.12" },
]

scikit-rf = { version = ">=0.30.0", optional = true }
scipy = [
  { version = "<=1.15.3", optional = true, python = "<3.11" },
  { version = ">=1.17.1", optional = true, python = ">=3.11" },
]
requests = { version = "*", optional = true }
typer = { version = ">=0.20.0", optional = true }
vtk = { version = ">=9.0, <9.7", optional = true }
rpyc = { version = ">=6.0.0", optional = true }
jupyterlab = { version = ">=4.6.2", optional = true }
ipython = { version = ">=7.30.0", optional = true }
beartype = { version = ">=0.22.9, <0.23", optional = true } # fixes exception on ansys-geometry-core with python >=3.14
dash-extensions = { version = "^2.0.6", optional = true }

[tool.poetry.extras]
aedt = [
  "pyaedt",
  "aiohttp",
  "httpx2",
  "matplotlib",
  "openpyxl",
  "osmnx",
  "pandas",
  "pyvista",
  "fast-simplification",
  "ansys-tools-visualization-interface",
  "tables",
  "rpds-py",
  "contourpy",
  "scikit-rf",
  "scipy",
  "vtk",
  "requests",
  "typer",
  "rpyc",
  "jupyterlab",
  "ipython",
]
fluent = [ "ansys-fluent-core", "httpx2", "pyansys-tools-report" ]
geometry = [ "ansys-geometry-core", "beartype" ]
mapdl = [ "ansys-mapdl-core" ]
mechanical = [ "ansys-mechanical-core" ]
optislang_wrapper = [ "ansys-optislang-core", "httpx2" ]
visor = [ "httpx2", "ansys-visor-viewer", "dash-extensions" ]
# didn't find a way to dynamically include previous groups, so we need to copy all dependencies
all = [
  "aiohttp",
  "pyaedt",
  "httpx2",
  "ansys-geometry-core",
  "ansys-fluent-core",
  "ansys-mapdl-core",
  "pyansys-tools-report",
  "ansys-mechanical-core",
  "ansys-optislang-core",
  "ansys-visor-viewer",
  "dash-extensions",
  "matplotlib",
  "openpyxl",
  "osmnx",
  "pandas",
  "pyvista",
  "fast-simplification",
  "ansys-tools-visualization-interface",
  "tables",
  "rpds-py",
  "contourpy",
  "scikit-rf",
  "scipy",
  "vtk",
  "requests",
  "typer",
  "rpyc",
  "jupyterlab",
  "ipython",
  "beartype",
]

[tool.poetry.group.doc]
optional = true
[tool.poetry.group.doc.dependencies]
ansys-sphinx-theme = { extras = [ "autoapi" ], version = "^1.7.0", python = ">=3.12" }
autodoc-pydantic = { version = "^2.2.0", python = ">=3.12" }
numpydoc = { version = "^1.10.0", python = ">=3.12" }
sphinx = { version = "^9.1.0", python = ">=3.12" }
sphinx-autodoc-typehints = { version = "^3.6.3", python = ">=3.12" }
sphinx-copybutton = { version = "^0.5.2", python = ">=3.12" }
sphinx-design = { version = "^0.7.0", python = ">=3.12" }

[tool.poetry.group.tests]
optional = true
[tool.poetry.group.tests.dependencies]
ansys-saf-glow-engine = { version = "^2.1.0", allow-prereleases = true, extras = [
  "dash",
  "pim",
  "hps",
] }
ansys-saf-testing = { version = ">=0.14.0, <1.0", allow-prereleases = true, extras = [
  "selenium",
  "hps",
  "pim",
] }
coverage = "^7.2.6"
docker = "^7.1.0"
grpcio-health-checking = "^1.24.0"
mock = "^4.0.3"
pytest = "~9.0.3" # Limited to <9.1.0 because higher versions produce a BDM error
pytest-asyncio = "^1.0.0"
pytest-cov = "^7.0.0"
pytest-html = "^4.1.1"
pytest-md = "^0.2.0"
pytest-mock = "^3.10.0"
pytest-rerunfailures = "^15.0.0"
pytest-timeout = "^2.3.1"
pytest-xdist = "^3.6.1"
gunicorn = "^23.0.0" # for launching UI server in DockerCompose
dash-extensions = "^2.0.6"

[tool.poetry.group.dev]
optional = true
[tool.poetry.group.dev.dependencies]
# TODO: use a tool that makes sure the version here and in the pre-commit file are in sync!
pyright = "1.1.407"
ruff = "0.15.0"
pre-commit = "^4.5"

[tool.ruff]
target-version = "py311"
line-length = 120

# in same order as in https://docs.astral.sh/ruff/rules
lint.select = [
  "A",      # flake8-builtins
  "ASYNC",  # flake8-async
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "C90",    # mccabe
  "COM",    # flake8-commas
  "E",      # pycodestyle - error
  "F",      # pyflakes
  "FAST",   # fastapi
  "I",      # isort
  "LOG",    # flake8-logging
  "N",      # pep8-naming
  "PIE",    # flake8-pie
  "PT",     # flake8-pytest-style
  "PTH",    # flake8-use-pathlib
  "PYI",    # flake8-pyi
  "Q",      # flake8-quotes
  "RUF100", # ruff-specific rules: unused noqa
  "SIM",    # flake8-simplify
  "TC",     # flake8-type-checking
  "UP",     # pyupgrade
  "W",      # pycodestyle - warning
]
lint.ignore = [ "PTH207" ]
lint.flake8-pytest-style.mark-parentheses = false
lint.flake8-type-checking.runtime-evaluated-base-classes = [ "pydantic.BaseModel", "pydantic_settings.BaseSettings" ]
lint.flake8-type-checking.runtime-evaluated-decorators = [ "attrs.define", "pydantic.validate_call" ]
lint.isort.force-sort-within-sections = true
lint.isort.known-first-party = [ "src", "doc", "tests" ]

[tool.codespell]
ignore-words = ".codespellignore"
skip = "*.json,,.git,.venv,.poetry,*.lcov,htmlcov,dist,./doc/build,*.aedt,batch.log,./pytest_logs,*.vtp,./hps_deployment/*,hps_deployment_logs.txt,poetry.lock"

[tool.pytest.ini_options]
pythonpath = "."
addopts = [
  "--strict-config",
  "--strict-markers",
  "--import-mode=importlib",
]
markers = [
  "use_pim",
  "use_hps",
  "use_aedt",
  "use_optislang",
  "use_mechanical",
  "use_mapdl",
  "use_fluent",
  "use_geometry",
  "use_visor",
]
testpaths = [ "tests/unit" ]
filterwarnings = [
  "error",
  "ignore::ResourceWarning",
  "ignore:defusedxml.cElementTree is deprecated, import from defusedxml.ElementTree instead.:DeprecationWarning",
  "ignore:The imp module is deprecated in favour of importlib and slated for removal in Python 3.12; see the module's documentation for alternative uses:DeprecationWarning",
  "ignore:This library is deprecated and will no longer be maintained. Functionality from this library has been migrated to ``ansys-tools-common``*:DeprecationWarning",
  "ignore:.* is deprecated and it will be removed in future versions of GLOW. Please, migrate your solution to use BDM.*:FutureWarning",
  "ignore:Accessing the 'model_fields' attribute on the instance is deprecated. Instead, you should access this attribute from the model class.*",
  "ignore:Accessing the 'model_computed_fields' attribute on the instance is deprecated. Instead, you should access this attribute from the model class.*",
  "ignore:Certificate verification is disabled",
]

[tool.coverage.run]
source = [ "ansys.saf.product_manager" ]

[tool.coverage.report]
show_missing = true
include = [ "src/*" ]
omit = [ "*/pytest-of-*/pytest-*/popen-*/*" ]

[tool.pyright]
pythonVersion = "3.11"
extraPaths = [ "src" ]
include = [ "src", "tests", "doc" ]
exclude = [
  ".venv",
  ".poetry",
  ".git",
  "src/ansys/saf/product_manager/visor",
  "tests/mocks/solution_end_to_end",
  "doc/source",
]
strict = [ "src", "tests", "doc" ]
venvPath = "."
venv = ".venv"

[build-system-requirements]
build-system-version = "2.3.2"

[tool.bandit]
exclude_dirs = [ "tests" ]
