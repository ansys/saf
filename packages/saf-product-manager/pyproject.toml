[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12.18,<0.13" ]

[project]
name = "ansys-saf-product-manager"
version = "0.6.dev0"
description = "SAF Product Manager"
readme = "README.rst"
license = "Apache-2.0"
license-files = [ "LICENSE" ]
maintainers = [ { name = "ANSYS, Inc.", email = "pyansys-core@synopsys.com" } ]
authors = [ { name = "ANSYS, Inc.", email = "pyansys-core@synopsys.com" } ]
requires-python = ">=3.11,<4"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Other Audience",
  "Natural Language :: English",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "ansys-bdm-api>=0.5.0,<1.0",
  "ansys-bdm-shared-volume>=0.4.0,<1.0",
  "ansys-saf-glow-engine>=2.3.dev0,<3.0.0",
  "ansys-saf-product-configuration>=0.25.0,<1.0",
]
optional-dependencies.aedt = [
  "aiohttp>=3.14.2,<4.0.0",
  "ansys-tools-visualization-interface>=0.1.0,<1.0",
  "contourpy<=1.3.2; python_version>='3.11' and python_version<'3.12'",
  "contourpy>=1.3.3,<2.0.0; python_version>='3.12'",
  "fast-simplification>=0.1.7,<1.0",
  "httpx2>=2.5.0,<3.0.0",
  "ipython>=7.30.0,<8.0.0",
  "jupyterlab>=4.6.2,<5.0.0",
  "matplotlib>=3.5.0,<4.0.0",
  "openpyxl>=3.1.0,<4.0.0",
  "osmnx>=2.0.0,<3.0.0",
  "pandas>=1.1.0",
  "pyaedt>=1.0.0,<2.0.0",
  "pyvista[io]>=0.38.0,<0.49",
  "requests>=2.0.0,<3.0.0",
  "rpds-py>=0.18.1,<2026; python_version>='3.11' and python_version<'3.13'",
  "rpds-py>=2026.5.1; python_version>='3.13'",
  "rpyc>=6.0.0,<7.0.0",
  "scikit-rf>=0.30.0,<1.0",
  "scipy<=1.15.3; python_version<'3.11'",
  "scipy>=1.17.1,<2.0.0; python_version>='3.11'",
  "tables<3.11; python_version>='3.11' and python_version<'3.13'",
  "tables>=3.11.1,<4.0.0; python_version>='3.13'",
  "typer>=0.20.0,<1.0",
  "vtk>=9.0,<9.7",
]
optional-dependencies.all = [
  "aiohttp>=3.14.2,<4.0.0",
  "ansys-fluent-core>=0.39,<1.0; python_version>='3.11' and python_version<'3.15'",
  "ansys-geometry-core>=0.14.1,<1.0",
  "ansys-mapdl-core>=0.73.0,<1.0; python_version>='3.11' and python_version<'3.15'",
  "ansys-mechanical-core>=0.12,<1.0; python_version>='3.11' and python_version<'3.15'",
  "ansys-optislang-core>=1.4.0",
  "ansys-tools-visualization-interface>=0.1.0,<1.0",
  "beartype>=0.22.9,<0.23",
  "contourpy<=1.3.2; python_version>='3.11' and python_version<'3.12'",
  "contourpy>=1.3.3,<2.0.0; python_version>='3.12'",
  "fast-simplification>=0.1.7,<1.0",
  "httpx2>=2.5.0,<3.0.0",
  "ipython>=7.30.0,<8.0.0",
  "jupyterlab>=4.6.2,<5.0.0",
  "matplotlib>=3.5.0,<4.0.0",
  "openpyxl>=3.1.0,<4.0.0",
  "osmnx>=2.0.0,<3.0.0",
  "pandas>=1.1.0",
  "pyaedt>=1.0.0,<2.0.0",
  "pyansys-tools-report",
  "pyvista[io]>=0.38.0,<0.49",
  "requests>=2.0.0,<3.0.0",
  "rpds-py>=0.18.1,<2026; python_version>='3.11' and python_version<'3.13'",
  "rpds-py>=2026.5.1; python_version>='3.13'",
  "rpyc>=6.0.0,<7.0.0",
  "scikit-rf>=0.30.0,<1.0",
  "scipy<=1.15.3; python_version<'3.11'",
  "scipy>=1.17.1,<2.0.0; python_version>='3.11'",
  "tables<3.11; python_version>='3.11' and python_version<'3.13'",
  "tables>=3.11.1,<4.0.0; python_version>='3.13'",
  "typer>=0.20.0,<1.0",
  "vtk>=9.0,<9.7",
]
optional-dependencies.fluent = [
  "ansys-fluent-core>=0.39,<1.0; python_version>='3.11' and python_version<'3.15'",
  "httpx2>=2.5.0",
  "pyansys-tools-report",
]
optional-dependencies.geometry = [
  "ansys-geometry-core>=0.14.1,<1.0",
  "beartype>=0.22.9,<0.23",
]
optional-dependencies.mapdl = [
  "ansys-mapdl-core>=0.73.0,<1.0; python_version>='3.11' and python_version<'3.15'",
]
optional-dependencies.mechanical = [
  "ansys-mechanical-core>=0.12,<1.0; python_version>='3.11' and python_version<'3.15'",
]
optional-dependencies.optislang-wrapper = [
  "ansys-optislang-core>=1.4.0",
  "httpx2>=2.5.0",
]
optional-dependencies.visor = [
  "httpx2>=2.5.0",
]

[tool.uv]
sources.ansys-product-manager = { workspace = true }
build-backend.module-name = "ansys.saf.product_manager"
build-backend.namespace = true
prerelease-package = { ansys-bdm-api = "allow", ansys-bdm-shared-volume = "allow", ansys-saf-glow-engine = "allow", ansys-saf-product-configuration = "allow" }
prereleases = "if-necessary"

[tool.pytest]
ini_options.testpaths = [ "tests/unit" ]
ini_options.pythonpath = "."
ini_options.addopts = [
  "--strict-config",
  "--strict-markers",
  "--import-mode=importlib",
]
ini_options.markers = [
  "use_aedt",
  "use_fluent",
  "use_geometry",
  "use_hps",
  "use_mapdl",
  "use_mechanical",
  "use_optislang",
  "use_pim",
  "use_visor",
]
ini_options.filterwarnings = [
  "error",
  "ignore::ResourceWarning",
  "ignore:defusedxml.cElementTree is deprecated, import from defusedxml.ElementTree instead.:DeprecationWarning",
  """\
  ignore:The imp module is deprecated in favour of importlib and slated for removal in Python 3.12; see the module's \
  documentation for alternative uses:DeprecationWarning\
  """,
  """\
  ignore:This library is deprecated and will no longer be maintained. Functionality from this library has been \
  migrated to ``ansys-tools-common``*:DeprecationWarning\
  """,
  """\
  ignore:.* is deprecated and it will be removed in future versions of GLOW. Please, migrate your solution to use \
  BDM.*:FutureWarning\
  """,
  """\
  ignore:Accessing the 'model_fields' attribute on the instance is deprecated. Instead, you should access this \
  attribute from the model class.*\
  """,
  """\
  ignore:Accessing the 'model_computed_fields' attribute on the instance is deprecated. Instead, you should access \
  this attribute from the model class.*\
  """,
  "ignore:Certificate verification is disabled",
]

[tool.coverage]
run.source = [ "ansys.saf.product_manager" ]
report.include = [ "src/*" ]
report.omit = [ "*/pytest-of-*/pytest-*/popen-*/*" ]
report.show_missing = true
