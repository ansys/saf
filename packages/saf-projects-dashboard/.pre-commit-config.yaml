ci:
  autofix_commit_msg: |
    chore: auto fixes from pre-commit.com hooks

    For more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: "chore/pre-commit-autoupdate"
  autoupdate_commit_msg: "chore: pre-commit automatic update"
  autoupdate_schedule: weekly

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3 # v0.15.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0 # 1.18.0
    hooks:
      - id: zizmor
        args: ["--pedantic"]

  # NOTE: Ruff does not check for python code in some part of the documentation,
  # e.g. python code block, ..., see https://github.com/astral-sh/ruff/issues/8237
  - repo: https://github.com/adamchainz/blacken-docs
    rev: 1.20.0 # 1.20.0
    hooks:
      - id: blacken-docs
        files: ^doc/.*\.(md|rst)$
        additional_dependencies: [black==25.1.0]
        args: ["--line-length=120"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0 # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^packages/saf-projects-dashboard/src/ansys_saf_projects_dashboard/
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3 # v2.4.1
    hooks:
      - id: codespell
        # HACK: pre-commit is used during the code-style job in CI/CD. This job
        # executes `pre-commit run --all-files --show-diff-on-failure`.
        # As per this issue https://github.com/pre-commit/pre-commit/issues/2936,
        # it looks like the `--all-files` only listens for the `exclude` option in a
        # pre-commit hook, ignoring `pyproject.toml` excludes.
        files: ^packages/saf-projects-dashboard/
        exclude: ^packages/saf-projects-dashboard/(tests/|doc/_build|doc/styles/|doc/source/_static|.*poetry\.lock|.*package-lock\.json|.*\.js)$
        args: [--ignore-words=packages/saf-projects-dashboard/.codespellignore]
        # TODO: pre-commit seems to ignore the configuration declared for codespell
  - repo: https://github.com/ansys/pre-commit-hooks
    # in the `pyproject.toml` file. For more details, see `[tool.codespell]` in
    # the `pyproject.toml` file.
    # additional_dependencies:
    #   - tomli

    rev: v0.8.0 # v0.5.2
    hooks:
      - id: add-license-headers
        # Having a license on the examples causes it to render as Markdown in the
        # documentation of the project.
        exclude: ^packages/saf-projects-dashboard/src/ansys_saf_projects_dashboard/
        args:
          - --start_year=2026

  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0 # v0.20.0
    hooks:
      - id: yamlfmt
        args:
          - "-formatter"
          - "max_line_length=80,retain_line_breaks=true,retain_line_breaks_single=true"

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.28.0 # v2.11.0
    hooks:
      - id: pyproject-fmt
        args: [--keep-full-version]

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.411 # v1.1.408
    hooks:
      - id: pyright
        stages: [manual]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
