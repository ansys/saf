tasks:
  # 1. Install Python dependencies using uv into a virtual environment
  setup-python:
    toolchain: 'system'
    command: 'uv sync --group build-saf-projects-dashboard'
    inputs:
      - '/pyproject.toml'
      - '/uv.lock'
    outputs:
      - '.venv/**/*'

  # 2. Clean install npm dependencies
  setup-node:
    toolchain: 'node'
    command: 'npm ci'
    inputs:
      - 'package.json'
      - 'package-lock.json'
    outputs:
      - 'node_modules'

  # 3. Execute the build using both environments
  build:
    toolchain: 'node'
    # Use 'uv run' to automatically execute the npm script with the .venv active
    command: 'npm run build'
    deps:
      - '~:setup-python'
      - '~:setup-node'
    inputs:
      - 'src/**/*'
      - 'package.json'
      - 'pyproject.toml'
      - '.venv/**/*'
    outputs:
      - 'src/ansys_saf_projects_dashboard/ansys_saf_projects_dashboard.js'
      - 'src/ansys_saf_projects_dashboard/*.py'
      - 'src/ansys_saf_projects_dashboard/metadata.json'
      - 'src/ansys_saf_projects_dashboard/proptypes.js'
      - 'src/ansys_saf_projects_dashboard/assets/**/*'
    options:
      mergeArgs: 'replace'
      mergeOutputs: 'replace'
      runFromWorkspaceRoot: false