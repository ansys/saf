[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12.18,<0.13" ]

[project]
name = "ansys-saf-projects-dashboard"
version = "0.3.dev0"
description = "Dash component for SAF-based solution applications to view and manage project instances."
readme = "README.rst"
keywords = [ "ansys", "dash", "dashboard", "glow", "projects", "saf" ]
license = "Apache-2.0"
license-files = [ "LICENSE" ]
maintainers = [ { name = "ANSYS, Inc.", email = "pyansys-core@synopsys.com" } ]
authors = [ { name = "ANSYS, Inc.", email = "pyansys-core@synopsys.com" } ]
requires-python = ">=3.11,<3.15"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Dash",
  "Intended Audience :: Other Audience",
  "Natural Language :: English",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "dash>=3.0.0,<4.0.0",
]

[tool.uv]
sources.ansys_saf_projects_dashboard = { workspace = true }
build-backend.module-name = "ansys_saf_projects_dashboard"
build-backend.namespace = true

[tool.pytest]
addopts = [
  "-v",
  "--tb=short",
  "--strict-config",
  "--strict-markers",
  "--import-mode=importlib",
  "-nlogical",
  "--dist=loadfile",
]
markers = [
  "e2e: marks tests as end-to-end browser tests (deselect with '-m \"not e2e\"')",
  "performance: marks tests as performance tests",
  "unit: marks tests as unit tests",
]
norecursedirs = [ "e2e", "performance", ".moon", ".venv", "tmp*", ".git" ]
python_classes = [ "Test*" ]
python_files = [ "test_*.py" ]
python_functions = [ "test_*" ]
testpaths = [ "tests" ]

[tool.coverage]
run.source = [ "ansys_saf_projects_dashboard" ]
run.omit = [
  "*/.venv/*",
  "*/pytest-of-*/pytest-*/popen-*/*",
  "*/site-packages/*",
  "*/Temp/*",
  "*/tests/*",
  "/tmp/*",
  "dist/*",
]
report.omit = [
  "*/_solutions/templates/*",
  "*/pytest-of-*/pytest-*/popen-*/*",
  "*/Temp/*",
  "*/tests/*",
  "/tmp/*",
  "dist/*",
]
report.show_missing = true
