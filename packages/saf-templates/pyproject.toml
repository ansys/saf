[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12.18,<0.13" ]

[project]
name = "ansys-saf-templates"
version = "0.4.dev0"
description = "Collection of templates to develop in SAF solutions."
readme = "README.rst"
license = "Apache-2.0"
license-files = [ "LICENSE" ]
maintainers = [ { name = "ANSYS, Inc.", email = "pyansys-core@synopsys.com" } ]
authors = [ { name = "ANSYS, Inc.", email = "pyansys-core@synopsys.com" } ]
requires-python = ">=3.11,<4"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Other Audience",

  "Natural Language :: English",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
entry-points."ansys_saf_templates".plugin_path = "ansys.saf.templates:get_plugin_path"

[tool.pytest]
log_cli = true
norecursedirs = [ ".moon", ".venv", "tmp*", ".git" ]
pythonpath = [ "." ]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--import-mode=importlib",
  "-nlogical",
  "--dist=loadfile",
]
markers = [  ]
filterwarnings = [  ]
testpaths = [ "tests" ]

[tool.coverage.run]
source = [ "ansys.saf.templates" ]
omit = [
  "tests/*",
]

[tool.coverage.report]
show_missing = true

[tool.pyright]
pythonVersion = "3.12"
venvPath = "../.."
venv = ".venv"
extraPaths = [ "src" ]
include = [
  "src/ansys/saf/templates",
  "tests",
]
exclude = [
  ".git",
  "**/*{{cookiecutter*/**", # Ignore files containing cookiecutter syntax
]
ignore = [ "**/*{{cookiecutter*/**" ]
strict = [
  "src/ansys/saf/templates",
  "tests",
]

[tool.uv.sources]
ansys-saf-templates = { workspace = true }

[tool.uv.build-backend]
module-name = "ansys.saf.templates"
namespace = true
