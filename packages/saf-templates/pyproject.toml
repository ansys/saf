[build-system]
build-backend = "poetry.core.masonry.api"
requires = [ "poetry-core>=2.0.0" ]

[project]
name = "ansys-saf-templates"
version = "0.4.dev0"
description = "Collection of templates to develop in SAF solutions."
readme = "README.rst"
license = "Apache-2.0"
maintainers = [
  { name = "ANSYS, Inc.", email = "pyansys-core@synopsys.com" },
]
authors = [
  { name = "ANSYS, Inc.", email = "pyansys-core@synopsys.com" },
]
requires-python = ">=3.11,<4"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Other Audience",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: English",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
entry-points."ansys_saf_templates".plugin_path = "ansys.saf.templates:get_plugin_path"

[[tool.poetry.packages]]
include = "ansys/saf/templates"
from = "src"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[tool.poetry.dependencies]
python = ">=3.11,<4"

[tool.poetry.group.doc]
optional = true
[tool.poetry.group.doc.dependencies]
ansys-sphinx-theme = { extras = [ "autoapi" ], version = "^1.7.0", python = ">=3.12" }
numpydoc = { version = "^1.10.0", python = ">=3.12" }
sphinx = { version = "^9.1.0", python = ">=3.12" }
sphinx-copybutton = { version = "^0.5.2", python = ">=3.12" }
sphinx-design = { version = "^0.7.0", python = ">=3.12" }
toml = "^0.10.2"

[tool.poetry.group.tests]
optional = true
[tool.poetry.group.tests.dependencies]
coverage = "^6.4.1"
pytest = "^9.0.3"
pytest-cov = "^4.0.0"
pytest-html = "^4.1.1"
pytest-md = "^0.2.0"
pytest-mock = "^3.10.0"
pytest-order = "^1.1.0"
pytest-rerunfailures = "^15.0.0"
pytest-timeout = "^2.3.1"
pytest-xdist = "^3.6.1"
tenacity = "^8.2.3"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
  "**/solution/**", # Ignore files containing cookiecutter syntax
  "**/ui/pages/**", # Ignore files containing cookiecutter syntax
  "conf.py",
]

# in same order as in https://docs.astral.sh/ruff/rules
lint.select = [
  "A",      # flake8-builtins
  "ASYNC",  # flake8-async
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "C90",    # mccabe
  "COM",    # flake8-commas
  "E",      # pycodestyle - error
  "F",      # pyflakes
  "FAST",   # fastapi
  "I",      # isort
  "LOG",    # flake8-logging
  "N",      # pep8-naming
  "PIE",    # flake8-pie
  "PT",     # flake8-pytest-style
  "PTH",    # flake8-use-pathlib
  "PYI",    # flake8-pyi
  "Q",      # flake8-quotes
  "RUF100", # ruff-specific rules: unused noqa
  "SIM",    # flake8-simplify
  "TC",     # flake8-type-checking
  "UP",     # pyupgrade
  "W",      # pycodestyle - warning
]
lint.ignore = [ "PYI034" ]
lint.flake8-pytest-style.mark-parentheses = false
lint.isort.force-sort-within-sections = true
lint.isort.known-first-party = [ "src", "doc", "tests" ]

[tool.coverage.run]
source = [ "ansys.saf.templates" ]
omit = [
  "read_toml.py",
  "tests/*",
]

[tool.coverage.report]
show_missing = true

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
extraPaths = [ "src" ]
include = [
  "src/ansys/saf/templates",
  "tests",
]
exclude = [
  ".venv",
  ".git",
  "**/solution/", # Ignore files containing cookiecutter syntax
  "**/ui/pages/", # Ignore files containing cookiecutter syntax
]
strict = [
  "src/ansys/saf/templates",
  "tests",
]

[build-system-requirements]
build-system-version = "2.3.2"
