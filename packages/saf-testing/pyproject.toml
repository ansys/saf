[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12.18,<0.13" ]

[project]
name = "ansys-saf-testing"
version = "0.15.dev0"
description = "Collection of test utilities for the Solution Application Framework."
readme = "README.rst"
license = "Apache-2.0"
license-files = [ "LICENSE" ]
maintainers = [ { name = "ANSYS, Inc.", email = "pyansys-core@synopsys.com" } ]
authors = [ { name = "ANSYS, Inc.", email = "pyansys-core@synopsys.com" } ]
requires-python = ">=3.11,<4"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Other Audience",
  "Natural Language :: English",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "click>=8.1.7,<9",
  "cryptography>=50.0.0,<51",
  "httpx2>=2.5.0,<3",
  "psutil>=7.0,<8",
  "pydantic>=2.7,<3",
  "pytest>=9.0.3,<9.1.0",         # Limited to <9.1.0 because higher versions produce a BDM error
  "pytest-mock>=3.15.0,<4",
  "pyyaml>=6.0.0,<7",
  "tenacity>=8.2.3,<9",           # has to be <9.0.0 to be compatible with ansys-conceptev-core 0.9.4
  "typing-extensions>=4.14.0,<5",
]

optional-dependencies.all = [
  "ansys-hps-client>=0.12,<1.0",
  "ansys-saf-product-configuration>=0.20,<1.0",
  "docker>=7.1.0,<8",
  "grpcio>=1.47.0,<2",
  "grpcio-health-checking>=1.24.0,<2",
  "selenium>=4.0,<5",
]
optional-dependencies.docker = [ "docker>=7.1.0,<8" ]
optional-dependencies.hps = [
  "ansys-hps-client>=0.12,<1.0",
  "ansys-saf-product-configuration>=0.20,<1.0",
  "docker>=7.1.0,<8",
]
optional-dependencies.pim = [
  "ansys-saf-product-configuration>=0.20,<1.0",
  "grpcio>=1.47.0,<2",
  "grpcio-health-checking>=1.24.0,<2",
]
optional-dependencies.selenium = [ "selenium>=4.0,<5" ]

entry-points.pytest11.saf_testing_common = "ansys.saf.testing.common"
entry-points.pytest11.saf_testing_database = "ansys.saf.testing.database"
# By registering the plugins here, they can be used without needing to declare them in pytest_plugins.
# https://docs.pytest.org/en/stable/how-to/writing_plugins.html#making-your-plugin-installable-by-others
entry-points.pytest11.saf_testing_directories = "ansys.saf.testing.directories"
entry-points.pytest11.saf_testing_docker = "ansys.saf.testing.docker"
entry-points.pytest11.saf_testing_docstring = "ansys.saf.testing.docstring_with_test_case"
entry-points.pytest11.saf_testing_hps = "ansys.saf.testing.hps"
entry-points.pytest11.saf_testing_mocking = "ansys.saf.testing.mocking"
entry-points.pytest11.saf_testing_network = "ansys.saf.testing.network"
entry-points.pytest11.saf_testing_pim = "ansys.saf.testing.pim"
entry-points.pytest11.saf_testing_platform_specific = "ansys.saf.testing.platform_specific"
entry-points.pytest11.saf_testing_process = "ansys.saf.testing.process"
entry-points.pytest11.saf_testing_pytest = "ansys.saf.testing.pytest"
entry-points.pytest11.saf_testing_selenium = "ansys.saf.testing.selenium"
entry-points.pytest11.saf_testing_solution = "ansys.saf.testing.solution"
entry-points.pytest11.saf_testing_solution_e2e = "ansys.saf.testing.solution.end_to_end"

[tool.black]
line-length = 120

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
  "*_pb2.py",
  "*_pb2_grpc.py",
]

[tool.pytest]
log_cli = true
norecursedirs = [ ".moon", ".venv", "tmp*", ".git" ]
pythonpath = [ "." ]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--import-mode=importlib",
]
testpaths = [ "tests" ]
filterwarnings = [
  "ignore:Accessing the 'model_fields' attribute on the instance is deprecated. Instead, you should access this attribute from the model class:DeprecationWarning",
  "ignore:Accessing the 'model_computed_fields' attribute on the instance is deprecated. Instead, you should access this attribute from the model class:DeprecationWarning",
]

[tool.coverage.run]
source = [ "ansys.saf.testing" ]

[tool.coverage.report]
show_missing = true
omit = [ "*/pytest-of-*/pytest-*/popen-*/*", "/tmp/*" ]

[tool.uv.sources]
ansys-saf-testing = { workspace = true }

[tool.uv.build-backend]
module-name = "ansys.saf.testing"
namespace = true