[project]
name = "ansys-saf-workspace"
version = "0.3.0"
maintainers = [ { name = "ANSYS, Inc.", email = "pyansys-core@synopsys.com" } ]
authors = [ { name = "ANSYS, Inc.", email = "pyansys-core@synopsys.com" } ]
requires-python = ">=3.11,<4.0"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "ansys-bdm-api",
  "ansys-bdm-shared-volume",
  "ansys-iam-oidc",
  "ansys-saf-cli",
  "ansys-solutions-dash-super-components",
  "ansys-saf-desktop-installer",
  "ansys-saf-desktop-orchestrator",
  "ansys-saf-glow-engine[all]",
  "ansys-saf-product-configuration[all]",
  "ansys-saf-product-manager[all]",
  "ansys-saf-templates",
  "ansys-saf-testing[all]",
]

[dependency-groups]
dev = [
  "bandit[toml]==1.9.4",
  "pip>=26.0.0",
  "pre-commit==4.6.0",
  "pyright==1.1.408",
  "ruff==0.15.0",
  { include-group = "doc" },
  { include-group = "style-desktop-installer" },
  { include-group = "tests" },
]
doc = [
  "ansys-sphinx-theme[autoapi]>=1.9; python_version>='3.12'",
  "autodoc-pydantic>=2.2.0; python_version>='3.12'",
  "click>=8.3.2; python_version>='3.12'",
  "docutils>=0.21; python_version>='3.12' and python_version<'4.0'",
  "linkchecker>=10.6.0; python_version>='3.12'",
  "nbsphinx>=0.9.8; python_version>='3.12'",
  "numpydoc>=1.10.0; python_version>='3.12'",
  "rst2html>=2020.7.4; python_version>='3.12'",
  "rst2html5>=2.0.1; python_version>='3.12' and python_version<'4.0'",
  "ruamel-yaml>=0.19.1; python_version>='3.12'",
  "sphinx>=9.1; python_version>='3.12'",
  "sphinx-code-tabs>=0.5.5; python_version>='3.12'",
  "sphinx-copybutton>=0.5.2; python_version>='3.12'",
  "sphinx-design>=0.7.0; python_version>='3.12'",
  "sphinx-gallery>=0.15.0; python_version>='3.12'",
  "sphinx-jinja>=2.0.0; python_version>='3.12'",
  "sphinx-markdown-builder>=0.6; python_version>='3.12'",
  "sphinx-tabs>=3.5.0; python_version>='3.12'",
  "sphinx-toolbox>=4.2.0; python_version>='3.12'",
  "sphinxcontrib-mermaid>=0.7.1; python_version>='3.12'",
  "sphinxemoji>=0.2; python_version>='3.12'",
  "toml>=0.10.2; python_version>='3.12'",
]
style-desktop-installer = [
  "ansys-saf-glow-engine[dash]>=2.1.0,<3.0.0",
  "dash-bootstrap-components>=1.2,<2.0",
  "pythonnet>=3.1.0,<4.0; python_version<'3.15'", # subdependency of pywebview. older versions don't support PEP 517 builds
  "pywebview>=6.0,<7.0",
]
tests = [
  "authlib>=1.8.0,<2",
  "coverage>=7.10.6,<8",
  "docker>=7.1.0,<8.0",               # lower versions are not compatible with requests >= 2.32 https://github.com/docker/docker-py/pull/3257
  "filelock>=3.8.0,<4",
  "httpx2-pytest>=1.0,<2",
  "mock>=4.0.3,<5",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.3.0,<2",
  "pytest-cov>=7.1.0,<8",
  "pytest-html>=4.1.1,<5",
  "pytest-md>=0.2.0,<1",
  "pytest-mock>=3.10.0,<4",
  "pytest-order>=1.1.0,<2",
  "pytest-rerunfailures>=16.1.0,<17",
  "pytest-timeout>=2.3.1,<3",
  "pytest-xdist>=3.6.1,<4",
  "tenacity>=8.0.0,<9",
]
tests-desktop-installer = [
  "ansys-saf-testing[selenium]>=0.13.0,<1.0",
  "dash>=3.0.0,<4.0",
  "dash-bootstrap-components>=1.2,<2.0",
  "httpx2>=2.5.0,<3.0",
  "pillow>=12.1.1,<13.0",
  "poetry==2.3.2",
  "pylnk3>=0.4.2,<0.5",
  "pywebview>=6.0,<7.0",
]
tests-glow-engine = [
  "aiohttp>=3.10.2,<4.0",
  "asgi-lifespan>=2.1.0,<3.0",
  "dash[diskcache]>=3.0.0,<4.0", # diskcache needed for background callbacks
  "numpy>=2.4.0,<3.0",
  "plotly>=6.5.0,<7.0",
  "prettytable>=3.17.0,<4.0",
  "pyc-wheel>=1.2.7,<2.0",
  "toml>=0.10.2,<2.0",
  "waitress>=3.0.1,<4.0",
]
tests-saf-cli = [
  "ansys-solutions-dash-super-components>=1.0.0,<2.0",
  "dash-bootstrap-components>=1.2,<2.0",
  "dash-mantine-components>=2.6.0,<3.0",
  "psutil>=7.2.2,<8.0",
  "pywinpty>=3.0.5,<4.0; sys_platform=='win32'",
]
tests-saf-desktop-orchestrator = [
  "ansys-saf-projects-dashboard>=0.2.0,<1.0",
  "dash>=3.4.0",
  "dash-extensions>=2.0.5,<3.0",
  "fastapi>=0.120.2,<1.0",
  "pandas>=1.1.0,<4.0",
  "streamlit>=1.58.0,<2.0",                   # For Streamlit-based UI server.
  "streamlit-antd-components>=0.3.2,<1.0",    # typical in Streamlit-based apps
  "tenacity>=8.5.0,<9",
]
tests-saf-product-manager = [
  "ansys-saf-glow-engine[dash,hps,pim]>=2.1.0,<3.0.0",
  "grpcio-health-checking>=1.24.0,<2.0",
  "gunicorn>=23.0.0,<24.0",                            # for launching UI server in DockerCompose
]

[tool.setuptools]
py-modules = []

[tool.uv]
override-dependencies = [
  { package = { name = "ansys-solutions-dash-super-components" }, dependencies = [ "dash>=2.18.2,<4.0" ] },
]
sources.ansys-bdm-api = { workspace = true }
sources.ansys-bdm-shared-volume = { workspace = true }
sources.ansys-solutions-dash-super-components = { workspace = true }
sources.ansys-iam-oidc = { workspace = true }
sources.ansys-saf-cli = { workspace = true }
sources.ansys-saf-desktop-installer = { workspace = true }
sources.ansys-saf-desktop-orchestrator = { workspace = true }
sources.ansys-saf-glow-engine = { workspace = true }
sources.ansys-saf-product-configuration = { workspace = true }
sources.ansys-saf-product-manager = { workspace = true }
sources.ansys-saf-templates = { workspace = true }
sources.ansys-saf-testing = { workspace = true }
package = false
workspace.members = [
  "packages/bdm-python-api",
  "packages/bdm-python-shared-volume",
  "packages/dash-super-components",
  "packages/glow-engine",
  "packages/saf-cli",
  "packages/saf-desktop-installer",
  "packages/saf-desktop-orchestrator",
  "packages/saf-iam-oidc",
  "packages/saf-product-configuration",
  "packages/saf-product-manager",
  "packages/saf-templates",
  "packages/saf-testing",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = [ "packages/*/doc", "packages/*/src", "packages/*/tests" ]
extend-exclude = [
  "**/tests/mocks/mock_products/wnua.py",
  "*_pb2.py",
  "*_pb2_grpc.py",
  "conf.py",
  "conf.py",
  "packages/**/[{][{]cookiecutter.*",     # Ignore files containing cookiecutter syntax
  "packages/**/_solutions/templates/**",  # Ignore files containing cookiecutter syntax
  "packages/**/tests/mocks/plugin/",      # Ignore files containing cookiecutter syntax
]
# in same order as in https://docs.astral.sh/ruff/rules
lint.select = [
  "A",      # flake8-builtins
  "ASYNC",  # flake8-async
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "C90",    # mccabe
  "COM",    # flake8-commas
  "E",      # pycodestyle - error
  "F",      # pyflakes
  "FAST",   # fastapi
  "I",      # isort
  "LOG",    # flake8-logging
  "N",      # pep8-naming
  "PIE",    # flake8-pie
  "PT",     # flake8-pytest-style
  "PTH",    # flake8-use-pathlib
  "PYI",    # flake8-pyi
  "Q",      # flake8-quotes
  "RUF100", # ruff-specific rules: unused noqa
  "S",      # flake8-bandit
  "SIM",    # flake8-simplify
  "TC",     # flake8-type-checking
  "UP",     # pyupgrade
  "W",      # pycodestyle - warning
]
lint.ignore = [ "COM812", "PTH207", "PYI034", "S112", "S603", "UP046", "UP047" ]
lint.per-file-ignores.".github/**" = [ "S" ]
lint.per-file-ignores.".venv/**" = [ "S" ]
lint.per-file-ignores."benchmarks/**" = [ "S" ]
lint.per-file-ignores."cache/**" = [ "S" ]
lint.per-file-ignores."packages/*/tests/**.py" = [ "S" ]
lint.per-file-ignores."packages/dash-super-components/src/ansys/solutions/dash_super_components/utils/svg_icons.py" = [
  "E501",
]
lint.per-file-ignores."packages/saf-cli/scripts/upgrade_solution_template_poetry_lock.py" = [ "S101" ]
lint.per-file-ignores."packages/saf-testing/src/ansys/saf/testing/**.py" = [
  "S",
]  # FIXME: temporary for the monorepo migration
# Ignore `S` rules everywhere except for the `src/` directory.
lint.per-file-ignores."tests/**.py" = [ "S" ]
lint.flake8-bugbear.extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Form",
  "fastapi.params.Depends",
  "fastapi.params.Form",
  "fastapi.params.Query",
  "fastapi.Query",
]
lint.flake8-pytest-style.mark-parentheses = false
lint.flake8-type-checking.runtime-evaluated-base-classes = [ "pydantic.BaseModel", "pydantic_settings.BaseSettings" ]
lint.flake8-type-checking.runtime-evaluated-decorators = [ "attrs.define", "pydantic.validate_call" ]
lint.isort.force-sort-within-sections = true
lint.isort.known-first-party = [
  "tests",
  "src",
  "doc",
  "ansys.bdm",
  "ansys.iam.oidc",
  "ansys.saf",
  "ansys.solutions",
]

[tool.bandit]
exclude_dirs = [ "**/tests" ]

[tool.pyright]
pythonVersion = "3.12"
venv = ".venv"
venvPath = "."
strict = [ "benchmarks", "scripts", "src", "tests" ]
include = [
  "benchmarks",
  "scripts",
  "src",
  "tests",
]
exclude = [
  "**/*_pb2.py",
  "**/*_pb2_grpc.py",
  "**/*{{cookiecutter*/**",
  "**/.venv",
  "**/_solutions/templates/",                                          # Ignore files containing cookiecutter syntax
  "**/{{cookiecutter.project_slug}}",
  "packages/saf-cli/tests/mocks/pages/first_page_with_file_output.py",
  "packages/saf-cli/tests/mocks/pages/first_page_with_hps.py",
  "packages/saf-cli/tests/mocks/pages/first_page_with_minerva.py",
  "packages/saf-cli/tests/mocks/plugin/",                              # Ignore files containing cookiecutter syntax
  "packages/saf-cli/tests/mocks/steps/first_step_with_file_output.py",
  "packages/saf-cli/tests/mocks/steps/first_step_with_hps.py",
  "packages/saf-cli/tests/mocks/steps/first_step_with_minerva.py",
  "packages/saf-cli/tests/unit/mocks/solutions/",
]
extraPaths = [ "src" ]

[tool.coverage]
report.show_missing = true
