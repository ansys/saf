<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-monospace, 'Cascadia Code', 'Fira Mono', monospace" font-size="13">
  <title>DAG fundamentals — download and upload</title>
  <desc>Diagram showing how StepSpec download and upload fields form a directed acyclic graph</desc>

  <defs>
    <marker id="arr-dag" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#818cf8"/>
    </marker>
    <marker id="arr-outofdate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f97316"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="380" fill="#0f172a" rx="12"/>

  <!-- Title -->
  <text x="380" y="32" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="700" letter-spacing="0.5">How the DAG Works</text>
  <text x="380" y="52" text-anchor="middle" fill="#64748b" font-size="11">StepSpec declarations define the data flow between fields</text>

  <!-- LEFT: Single-step DAG -->
  <text x="40" y="82" fill="#94a3b8" font-size="11" font-weight="600">SINGLE-STEP DAG</text>

  <!-- download field -->
  <rect x="40" y="96" width="160" height="44" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="54" y="114" fill="#7dd3fc" font-size="9" font-weight="600">DOWNLOAD (input)</text>
  <text x="54" y="130" fill="#93c5fd" font-size="11" font-weight="700">temperature</text>

  <!-- transaction box -->
  <rect x="80" y="162" width="120" height="36" rx="8" fill="#312e81" stroke="#818cf8" stroke-width="1.5"/>
  <text x="140" y="184" text-anchor="middle" fill="#c7d2fe" font-size="10" font-weight="700">@transaction</text>

  <!-- upload field -->
  <rect x="40" y="220" width="160" height="44" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="54" y="238" fill="#6ee7b7" font-size="9" font-weight="600">UPLOAD (output)</text>
  <text x="54" y="254" fill="#a7f3d0" font-size="11" font-weight="700">results</text>

  <!-- arrows -->
  <line x1="120" y1="140" x2="120" y2="162" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arr-dag)"/>
  <line x1="120" y1="198" x2="120" y2="220" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arr-dag)"/>

  <!-- RIGHT: Cross-step DAG -->
  <text x="320" y="82" fill="#94a3b8" font-size="11" font-weight="600">CROSS-STEP DAG</text>

  <!-- SetupStep box -->
  <rect x="320" y="96" width="200" height="100" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="320" y="96" width="200" height="26" rx="10" fill="#1e3a5f"/>
  <rect x="320" y="112" width="200" height="10" fill="#1e3a5f"/>
  <text x="420" y="114" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="700">SetupStep</text>
  <rect x="336" y="132" width="168" height="24" rx="5" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="420" y="148" text-anchor="middle" fill="#7dd3fc" font-size="10">temperature</text>
  <rect x="336" y="162" width="168" height="24" rx="5" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="420" y="178" text-anchor="middle" fill="#7dd3fc" font-size="10">pressure</text>

  <!-- AnalysisStep box -->
  <rect x="560" y="96" width="170" height="100" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="560" y="96" width="170" height="26" rx="10" fill="#064e3b"/>
  <rect x="560" y="112" width="170" height="10" fill="#064e3b"/>
  <text x="645" y="114" text-anchor="middle" fill="#a7f3d0" font-size="11" font-weight="700">AnalysisStep</text>
  <rect x="576" y="140" width="138" height="24" rx="5" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="645" y="156" text-anchor="middle" fill="#6ee7b7" font-size="10">solver_result</text>

  <!-- cross-step arrows -->
  <path d="M 504 144 L 576 148" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arr-dag)"/>
  <path d="M 504 174 L 576 156" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arr-dag)"/>

  <!-- OUTOFDATE cascade -->
  <text x="320" y="230" fill="#94a3b8" font-size="11" font-weight="600">AUTOMATIC INVALIDATION</text>

  <!-- Setup field changed -->
  <rect x="320" y="244" width="200" height="40" rx="8" fill="#431407" stroke="#f97316" stroke-width="1.5"/>
  <text x="420" y="260" text-anchor="middle" fill="#fdba74" font-size="10" font-weight="600">User changes</text>
  <text x="420" y="276" text-anchor="middle" fill="#fb923c" font-size="11" font-weight="700">setup.temperature</text>

  <!-- arrow -->
  <path d="M 520 264 L 560 264" stroke="#f97316" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-outofdate)"/>

  <!-- Result marked outofdate -->
  <rect x="560" y="244" width="170" height="40" rx="8" fill="#1c1917" stroke="#f97316" stroke-width="1.5"/>
  <text x="645" y="260" text-anchor="middle" fill="#fb923c" font-size="10" font-weight="600">Automatically marked</text>
  <text x="645" y="276" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700">OUTOFDATE</text>

  <!-- Legend -->
  <rect x="40" y="300" width="680" height="66" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <rect x="60" y="316" width="12" height="12" rx="3" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="80" y="326" fill="#7dd3fc" font-size="10">download — field is read (input)</text>
  <rect x="280" y="316" width="12" height="12" rx="3" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="300" y="326" fill="#6ee7b7" font-size="10">upload — field is written (output)</text>
  <rect x="510" y="316" width="12" height="12" rx="3" fill="#431407" stroke="#f97316" stroke-width="1.5"/>
  <text x="530" y="326" fill="#fb923c" font-size="10">change → cascade invalidation</text>

  <text x="60" y="352" fill="#64748b" font-size="10">Upstream changes automatically mark all downstream dependents as OUTOFDATE — no manual invalidation needed.</text>
</svg>
