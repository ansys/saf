<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-monospace, 'Cascadia Code', 'Fira Mono', monospace" font-size="13">
  <title>saf execute architecture</title>
  <desc>Diagram showing how saf execute runs a command inside the solution's .venv without manual activation</desc>

  <defs>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f97316"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#22c55e"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#0f172a" rx="12"/>

  <text x="320" y="34" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="700" letter-spacing="0.5">saf execute — Architecture</text>

  <rect x="180" y="54" width="280" height="48" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
  <text x="320" y="74" text-anchor="middle" fill="#fdba74" font-size="13" font-weight="600">$ saf execute &lt;cmd&gt;</text>
  <text x="320" y="92" text-anchor="middle" fill="#64748b" font-size="10">no need to activate .venv manually</text>

  <line x1="320" y1="102" x2="320" y2="136" stroke="#f97316" stroke-width="1.5" marker-end="url(#arr-orange)"/>

  <rect x="90" y="140" width="460" height="110" rx="8" fill="#1c1917" stroke="#f97316" stroke-width="1.5"/>
  <text x="320" y="162" text-anchor="middle" fill="#fed7aa" font-size="12" font-weight="700">saf execute runner</text>

  <rect x="110" y="174" width="190" height="30" rx="5" fill="#0f172a"/>
  <text x="205" y="194" text-anchor="middle" fill="#94a3b8" font-size="10">1. resolves .venv/bin/python</text>

  <rect x="340" y="174" width="190" height="30" rx="5" fill="#0f172a"/>
  <text x="435" y="194" text-anchor="middle" fill="#94a3b8" font-size="10">2. prepends .venv/bin to PATH</text>

  <rect x="110" y="214" width="190" height="30" rx="5" fill="#0f172a"/>
  <text x="205" y="234" text-anchor="middle" fill="#94a3b8" font-size="10">3. runs &lt;cmd&gt; inside .venv</text>

  <rect x="340" y="214" width="190" height="30" rx="5" fill="#0f172a"/>
  <text x="435" y="234" text-anchor="middle" fill="#94a3b8" font-size="10">4. streams output to terminal</text>

  <line x1="320" y1="250" x2="320" y2="284" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <rect x="90" y="288" width="460" height="100" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="90" y="288" width="460" height="34" rx="10" fill="#064e3b"/>
  <rect x="90" y="310" width="460" height="12" fill="#064e3b"/>
  <text x="320" y="308" text-anchor="middle" fill="#a7f3d0" font-size="12" font-weight="700">.venv — Solution's virtual environment</text>

  <rect x="110" y="328" width="200" height="48" rx="6" fill="#0f172a"/>
  <text x="210" y="346" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="600">python + solution packages</text>
  <text x="210" y="361" text-anchor="middle" fill="#475569" font-size="9">.venv/bin/python</text>
  <text x="210" y="374" text-anchor="middle" fill="#475569" font-size="9">.venv/lib/python*/site-packages</text>

  <rect x="330" y="328" width="200" height="48" rx="6" fill="#0f172a"/>
  <text x="430" y="346" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="600">activated environment</text>
  <text x="430" y="361" text-anchor="middle" fill="#475569" font-size="9">PATH → .venv/bin prepended</text>
  <text x="430" y="374" text-anchor="middle" fill="#475569" font-size="9">no shell activation required</text>

  <text x="320" y="406" text-anchor="middle" fill="#475569" font-size="10">saf execute handles environment activation transparently — the command runs as if .venv were active</text>
</svg>
