<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-monospace, 'Cascadia Code', 'Fira Mono', monospace" font-size="13">
  <title>Recommended development flow</title>
  <desc>Diagram showing the recommended development flow: write domain logic, unit-test, wire into SAF, integration test</desc>

  <defs>
    <marker id="arr-flow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#818cf8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="400" fill="#0f172a" rx="12"/>

  <!-- Title -->
  <text x="380" y="36" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="700" letter-spacing="0.5">Recommended Development Flow</text>
  <text x="380" y="56" text-anchor="middle" fill="#64748b" font-size="11">Validate domain logic before wiring it into SAF</text>

  <!-- Step 1 -->
  <rect x="40" y="80" width="320" height="58" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
  <circle cx="66" cy="109" r="14" fill="#312e81" stroke="#818cf8" stroke-width="1.5"/>
  <text x="66" y="113" text-anchor="middle" fill="#c7d2fe" font-size="12" font-weight="700">1</text>
  <text x="90" y="103" fill="#c7d2fe" font-size="12" font-weight="600">Write domain logic</text>
  <text x="90" y="122" fill="#94a3b8" font-size="10">Pure Python functions — no SAF imports</text>

  <!-- Step 2 -->
  <rect x="40" y="158" width="320" height="58" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
  <circle cx="66" cy="187" r="14" fill="#312e81" stroke="#818cf8" stroke-width="1.5"/>
  <text x="66" y="191" text-anchor="middle" fill="#c7d2fe" font-size="12" font-weight="700">2</text>
  <text x="90" y="181" fill="#c7d2fe" font-size="12" font-weight="600">Unit-test logic</text>
  <text x="90" y="200" fill="#94a3b8" font-size="10">pytest, standalone scripts</text>

  <!-- Step 3 -->
  <rect x="40" y="236" width="320" height="58" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <circle cx="66" cy="265" r="14" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
  <text x="66" y="269" text-anchor="middle" fill="#a7f3d0" font-size="12" font-weight="700">3</text>
  <text x="90" y="259" fill="#a7f3d0" font-size="12" font-weight="600">Wire into SAF</text>
  <text x="90" y="278" fill="#94a3b8" font-size="10">StepModel + @transaction</text>

  <!-- Step 4 -->
  <rect x="40" y="314" width="320" height="58" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <circle cx="66" cy="343" r="14" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
  <text x="66" y="347" text-anchor="middle" fill="#a7f3d0" font-size="12" font-weight="700">4</text>
  <text x="90" y="337" fill="#a7f3d0" font-size="12" font-weight="600">Integration test</text>
  <text x="90" y="356" fill="#94a3b8" font-size="10">Run via saf run, verify on /docs</text>

  <!-- Vertical arrows -->
  <line x1="200" y1="138" x2="200" y2="158" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arr-flow)"/>
  <line x1="200" y1="216" x2="200" y2="236" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arr-flow)"/>
  <line x1="200" y1="294" x2="200" y2="314" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arr-flow)"/>

  <!-- Right side: annotations -->
  <rect x="420" y="80" width="310" height="136" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <rect x="420" y="80" width="310" height="30" rx="10" fill="#1e3a5f"/>
  <rect x="420" y="98" width="310" height="12" fill="#1e3a5f"/>
  <text x="436" y="99" fill="#93c5fd" font-size="11" font-weight="700">Why this order?</text>

  <text x="436" y="128" fill="#94a3b8" font-size="10">• Catches algorithm bugs early</text>
  <text x="436" y="148" fill="#94a3b8" font-size="10">• No framework overhead during debugging</text>
  <text x="436" y="168" fill="#94a3b8" font-size="10">• Domain functions are reusable and testable</text>
  <text x="436" y="188" fill="#94a3b8" font-size="10">• SAF wiring is validated independently</text>
  <text x="436" y="208" fill="#94a3b8" font-size="10">• Integration test confirms end-to-end flow</text>

  <rect x="420" y="236" width="310" height="160" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <rect x="420" y="236" width="310" height="30" rx="10" fill="#064e3b"/>
  <rect x="420" y="254" width="310" height="12" fill="#064e3b"/>
  <text x="436" y="255" fill="#a7f3d0" font-size="11" font-weight="700">Example structure</text>

  <text x="436" y="286" fill="#34d399" font-size="10">my-solution/</text>
  <text x="436" y="304" fill="#94a3b8" font-size="10">├── src/ansys/solutions/my_solution/solution/</text>
  <text x="436" y="320" fill="#94a3b8" font-size="10">│   ├── logic/</text>
  <text x="436" y="336" fill="#6ee7b7" font-size="10">│   │   └── beam_solver.py</text>
  <text x="620" y="336" fill="#64748b" font-size="9">← step 1</text>
  <text x="436" y="352" fill="#6ee7b7" font-size="10">│   └── beam_step.py</text>
  <text x="586" y="352" fill="#64748b" font-size="9">← step 3</text>
  <text x="436" y="368" fill="#94a3b8" font-size="10">└── tests/</text>
  <text x="436" y="384" fill="#6ee7b7" font-size="10">    └── test_beam_solver.py</text>
  <text x="612" y="384" fill="#64748b" font-size="9">← step 2</text>
</svg>
