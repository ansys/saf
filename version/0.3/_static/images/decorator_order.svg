<svg viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-monospace, 'Cascadia Code', 'Fira Mono', monospace" font-size="13">
  <title>Decorator stacking order</title>
  <desc>Diagram showing the required decorator order: @transaction outermost, @create_instance middle, @long_running innermost</desc>

  <!-- Background -->
  <rect width="760" height="280" fill="#0f172a" rx="12"/>

  <!-- Title -->
  <text x="380" y="32" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="700" letter-spacing="0.5">Decorator Stacking Order</text>
  <text x="380" y="52" text-anchor="middle" fill="#64748b" font-size="11">Outermost first — @transaction is always on top</text>

  <!-- Nested boxes to show stacking -->
  <!-- Outermost: @transaction -->
  <rect x="80" y="72" width="600" height="190" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
  <text x="100" y="96" fill="#c7d2fe" font-size="12" font-weight="700">@transaction</text>
  <text x="280" y="96" fill="#64748b" font-size="10">← outermost (always first)</text>

  <!-- Middle: @create_instance -->
  <rect x="110" y="108" width="540" height="138" rx="10" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="130" y="130" fill="#93c5fd" font-size="12" font-weight="700">@create_instance</text>
  <text x="310" y="130" fill="#64748b" font-size="10">← middle (product lifecycle, optional)</text>

  <!-- Innermost: @long_running -->
  <rect x="140" y="142" width="480" height="88" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
  <text x="160" y="164" fill="#a7f3d0" font-size="12" font-weight="700">@long_running</text>
  <text x="310" y="164" fill="#64748b" font-size="10">← innermost (closest to function)</text>

  <!-- Function -->
  <rect x="170" y="178" width="420" height="36" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="186" y="196" fill="#fbbf24" font-size="11" font-weight="600">def</text>
  <text x="210" y="196" fill="#e2e8f0" font-size="11"> my_method(self, product_instance): ...</text>

  <!-- Legend -->
  <text x="100" y="272" fill="#64748b" font-size="10">Not all decorators are required — use only what you need. But when combined, this order is mandatory.</text>
</svg>
