  <text x="750" y="46" text-anchor="middle" class="title">How pyproject.toml changes: Poetry to UV</text>
  <text x="750" y="72" text-anchor="middle" class="subtitle">Selected sections move from one pyproject.toml to the other; arrows show common destinations.</text>

