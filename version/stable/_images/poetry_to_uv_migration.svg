<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title description">
  <title id="title">How pyproject.toml changes from Poetry to UV</title>
  <desc id="description">A sketch-style diagram of selected sections moving from a Poetry pyproject.toml to a UV pyproject.toml.</desc>
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 Q5 5 1 10 M2 1 L10 6 L2 11" fill="none" stroke="#546577" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="sketchy-stroke" x="-2%" y="-8%" width="104%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="1" seed="8" result="grain"/>
      <feDisplacementMap in="SourceGraphic" in2="grain" scale="2.1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <style>
      .title { font: 700 30px "Segoe UI", Arial, sans-serif; fill: #283c4a; }
      .subtitle { font: 16px "Segoe UI", Arial, sans-serif; fill: #52616c; }
      .panel { fill: #fffdf7; stroke: #667887; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .panel-echo { fill: none; stroke: #667887; stroke-width: 1.25; opacity: .58; stroke-linecap: round; stroke-linejoin: round; }
      .panel-title { font: 700 20px "Segoe UI", Arial, sans-serif; fill: #304757; }
      .card-left { fill: #fff0dc; stroke: #c97b38; }
      .card-right { fill: #e8f4e9; stroke: #4a8960; }
      .card-line { stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .card-echo { fill: none; stroke-width: 1.35; opacity: .58; stroke-linecap: round; stroke-linejoin: round; }
      .code { font: 16px Consolas, "Courier New", monospace; fill: #263b4b; }
      .detail { font: 14px "Segoe UI", Arial, sans-serif; fill: #596671; }
      .arrow { fill: none; stroke: #546577; stroke-width: 2.7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowhead); }
      .arrow-echo { fill: none; stroke: #778897; stroke-width: 1.1; opacity: .55; stroke-linecap: round; stroke-linejoin: round; }
      .note { font: 14px "Segoe UI", Arial, sans-serif; fill: #52616c; }
      .panel, .panel-echo, .card-line, .card-echo { filter: url(#sketchy-stroke); }
    </style>
  </defs>

  <rect width="1500" height="760" fill="#f7f3e9"/>
